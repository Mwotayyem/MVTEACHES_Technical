<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MVTeaches - محاكي توضيحي للمالك</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #667085;
      --line: #d9e2ec;
      --panel: #ffffff;
      --soft: #f6f8fb;
      --brand: #146c94;
      --brand-2: #1b998b;
      --accent: #f4b942;
      --danger: #c2413b;
      --success: #237a57;
      --warn: #a15c07;
      --shadow: 0 14px 34px rgba(23, 32, 42, .10);
      --radius: 8px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background:
        linear-gradient(180deg, rgba(20,108,148,.08), rgba(27,153,139,.04) 34%, #f7f9fc 100%),
        #f7f9fc;
      color: var(--ink);
      line-height: 1.65;
      overflow-x: hidden;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: .55rem .85rem;
      cursor: pointer;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(20, 108, 148, .18); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(244,185,66,.45);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .56; transform: none; box-shadow: none; }
    .btn-secondary { background: #fff; color: var(--brand); border-color: #b9ccda; }
    .btn-soft { background: #eef7f6; color: #11695f; border-color: #bfe1dd; }
    .btn-danger { background: var(--danger); }
    .btn-warning { background: var(--accent); color: #2d2610; }
    .btn-ghost { background: transparent; color: var(--brand); border-color: transparent; }
    .btn-small { min-height: 34px; padding: .35rem .55rem; font-size: .88rem; }

    .demo-ribbon {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #0f3d56;
      color: #fff;
      padding: .7rem 1rem;
      text-align: center;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(15, 61, 86, .18);
    }

    .app-shell { min-height: 100vh; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem clamp(1rem, 3vw, 2rem);
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      gap: .75rem;
      align-items: center;
      min-width: 0;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .brand h1, .brand p { margin: 0; }
    .brand h1 { font-size: 1.05rem; }
    .brand p { color: var(--muted); font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .top-actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 1.1rem;
      padding: 1.1rem clamp(1rem, 3vw, 2rem) 2rem;
      max-width: 1440px;
      margin: 0 auto;
    }

    .sidebar, .panel, .hero, .tour, .modal-card {
      background: rgba(255,255,255,.95);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .sidebar { padding: .85rem; align-self: start; position: sticky; top: 72px; }
    .nav-title { margin: .35rem .3rem .75rem; color: var(--muted); font-size: .9rem; }
    .nav-list { display: grid; gap: .35rem; }
    .nav-button {
      width: 100%;
      text-align: right;
      color: var(--ink);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      font-weight: 700;
    }
    .nav-button.active, .nav-button:hover { background: #edf6fa; color: var(--brand); transform: none; box-shadow: none; }

    .content { min-width: 0; display: grid; gap: 1rem; }

    .hero {
      padding: clamp(1rem, 3vw, 1.5rem);
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, .7fr);
      gap: 1rem;
      align-items: center;
      overflow: hidden;
    }

    .hero h2, .panel h2, .panel h3, .modal-card h3 { margin: 0 0 .45rem; line-height: 1.35; }
    .hero p, .panel p { margin: .25rem 0; color: var(--muted); }

    .hero-art {
      min-height: 170px;
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 78% 20%, rgba(244,185,66,.8), transparent 25%),
        linear-gradient(135deg, #146c94, #1b998b);
      color: #fff;
      padding: 1rem;
      display: grid;
      align-content: end;
      position: relative;
      overflow: hidden;
    }
    .hero-art::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 10px;
    }
    .hero-art strong { position: relative; font-size: 1.55rem; }
    .hero-art span { position: relative; opacity: .9; }

    .grid { display: grid; gap: 1rem; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .panel { padding: 1rem; min-width: 0; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: .8rem;
    }
    .panel-actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }

    .metric {
      padding: .9rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      display: grid;
      gap: .2rem;
    }
    .metric b { font-size: 1.45rem; color: var(--brand); }
    .metric span { color: var(--muted); font-size: .9rem; }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: .12rem .55rem;
      border-radius: 999px;
      font-size: .82rem;
      font-weight: 800;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge.ok { color: var(--success); background: #eaf7f0; border-color: #bfe5cf; }
    .badge.warn { color: var(--warn); background: #fff5df; border-color: #f3d393; }
    .badge.bad { color: var(--danger); background: #fff0ee; border-color: #efc1bd; }
    .badge.info { color: var(--brand); background: #edf6fa; border-color: #bfdae8; }
    .badge.neutral { color: #475467; background: #f3f4f6; border-color: #d7dbe0; }

    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td { padding: .7rem .75rem; border-bottom: 1px solid var(--line); text-align: right; vertical-align: middle; }
    th { color: #344054; background: #f1f6f8; font-size: .9rem; }
    tr:last-child td { border-bottom: 0; }

    .mobile-list { display: none; gap: .7rem; }
    .item-card { border: 1px solid var(--line); border-radius: var(--radius); padding: .85rem; background: #fff; display: grid; gap: .45rem; }
    .item-card .row { display: flex; justify-content: space-between; gap: .75rem; align-items: center; }
    .item-card small { color: var(--muted); }

    .portal-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .65rem;
      margin-top: 1rem;
    }
    .portal-page {
      border: 1px solid #cfe0ea;
      border-radius: var(--radius);
      background: #fbfdff;
      padding: .75rem;
      display: grid;
      gap: .25rem;
      min-height: 96px;
    }
    .portal-page code {
      direction: ltr;
      text-align: left;
      color: #24536a;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .portal-page span { color: var(--muted); font-size: .88rem; }

    .timeline { display: grid; gap: .65rem; }
    .timeline-row {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr) auto;
      gap: .75rem;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: .7rem;
    }
    .timeline-row time { color: var(--muted); font-size: .88rem; }

    .answer-grid { display: grid; gap: .55rem; }
    .answer-option {
      width: 100%;
      text-align: right;
      background: #fff;
      color: var(--ink);
      border-color: #c9d6e2;
      box-shadow: none;
      justify-content: flex-start;
    }
    .answer-option.selected, .answer-option:hover {
      background: #edf6fa;
      color: var(--brand);
      transform: none;
      box-shadow: none;
    }

    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; align-items: end; }
    label { display: grid; gap: .25rem; font-weight: 800; color: #344054; }
    input, select, textarea {
      width: 100%;
      border: 1px solid #c9d6e2;
      border-radius: var(--radius);
      min-height: 42px;
      padding: .5rem .65rem;
      background: #fff;
      color: var(--ink);
    }
    textarea { min-height: 92px; resize: vertical; }

    .login {
      max-width: 1180px;
      margin: 0 auto;
      padding: clamp(1rem, 3vw, 2rem);
      display: grid;
      gap: 1rem;
    }
    .role-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      background: #fff;
      box-shadow: var(--shadow);
      display: grid;
      gap: .65rem;
      text-align: right;
    }
    .role-card h3 { margin: 0; }
    .credentials {
      background: #f7fafc;
      border: 1px dashed #bfd2df;
      border-radius: var(--radius);
      padding: .65rem;
      color: #344054;
      direction: ltr;
      text-align: left;
      font-size: .86rem;
      overflow-wrap: anywhere;
    }

    .notice {
      border: 1px solid #bfe1dd;
      background: #eef9f7;
      color: #125d55;
      border-radius: var(--radius);
      padding: .85rem;
      font-weight: 700;
    }
    .notice.warn { border-color: #f3d393; background: #fff8e8; color: #764300; }
    .notice.bad { border-color: #efc1bd; background: #fff3f1; color: #8a2e29; }

    .progress {
      height: 12px;
      background: #e7edf3;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-2), var(--brand)); }

    .tour {
      border-color: #f0cf82;
      background: #fffaf0;
      padding: .9rem;
    }
    .tour strong { color: #6c4507; }
    .tour-controls { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .7rem; }

    .toast-area {
      position: fixed;
      z-index: 80;
      left: 1rem;
      bottom: 1rem;
      display: grid;
      gap: .5rem;
      width: min(420px, calc(100vw - 2rem));
    }
    .toast {
      border-radius: var(--radius);
      background: #102f43;
      color: #fff;
      box-shadow: var(--shadow);
      padding: .75rem .9rem;
      animation: rise .2s ease;
    }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    dialog {
      border: 0;
      padding: 0;
      background: transparent;
      width: min(620px, calc(100vw - 2rem));
    }
    dialog::backdrop { background: rgba(15, 32, 42, .48); }
    .modal-card { padding: 1rem; }
    .modal-actions { display: flex; justify-content: flex-start; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }

    .empty {
      border: 1px dashed #c9d6e2;
      border-radius: var(--radius);
      padding: 1rem;
      color: var(--muted);
      background: #fbfdff;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .nav-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero { grid-template-columns: 1fr; }
      .grid-4, .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .portal-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      .topbar { align-items: stretch; flex-direction: column; }
      .top-actions { justify-content: stretch; }
      .top-actions button { flex: 1 1 auto; }
      .nav-list, .grid-2, .grid-3, .grid-4, .form-row { grid-template-columns: 1fr; }
      .panel-head { flex-direction: column; }
      .panel-actions { justify-content: stretch; width: 100%; }
      .panel-actions button { flex: 1 1 auto; }
      .table-wrap { display: none; }
      .mobile-list { display: grid; }
      .hero-art { min-height: 130px; }
      .demo-ribbon { font-size: .9rem; }
      .portal-strip, .timeline-row { grid-template-columns: 1fr; }
      .timeline-row { align-items: start; }
    }
  </style>
</head>

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch {
          storageAvailable = false;
        }
        return buildSeed();
      }

      function saveState() {
        memoryState = state;
        try {
          if (storageAvailable) localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch {
          storageAvailable = false;
        }
      }

      function resetDemo() {
        state = buildSeed();
        try { localStorage.removeItem(STORAGE_KEY); } catch { storageAvailable = false; }
        saveState();
        toast('تمت إعادة ضبط البيانات التجريبية إلى البداية.');
        render();
      }

      function currentUser() {
        return state.users.find(u => u.id === state.currentUserId) || null;
      }

      function setUser(userId) {
        const user = state.users.find(u => u.id === userId);
        state.currentUserId = userId;
        state.activeSection = nav[user.role][0][0];
        saveState();
        render();
      }

      function setSection(section) {
        state.activeSection = section;
        saveState();
        render();
      }

      function h(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }

      function fmtDate(iso) {
        return new Intl.DateTimeFormat('ar-JO', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));
      }

      function fmtMoney(amount, currency = 'JOD') {
        return new Intl.NumberFormat('ar-JO', { style: 'currency', currency, maximumFractionDigits: 2 }).format(amount);
      }

      function durationHours(session) {
        return session.duration / 60;
      }

      function teacher(id) { return state.teachers.find(t => t.id === id); }
      function student(id = 'ST-1') { return state.students.find(s => s.id === id); }
      function sessionById(id) { return state.sessions.find(s => s.id === id); }
      function userByRole(role) { return state.users.find(u => u.role === role); }

      function activeBookings(sessionId) {
        return state.bookings.filter(b => b.sessionId === sessionId && b.status === 'active');
      }

      function seatsTaken(sessionId) {
        return activeBookings(sessionId).length;
      }

      function studentBookings(studentId = 'ST-1') {
        return state.bookings.filter(b => b.studentId === studentId && b.status === 'active');
      }

      function attendanceFor(sessionId, studentId = 'ST-1') {
        return state.attendance.find(a => a.sessionId === sessionId && a.studentId === studentId);
      }

      function ledgerBalance(studentId = 'ST-1') {
        return state.ledger.filter(l => l.studentId === studentId).reduce((sum, l) => sum + l.hours, 0);
      }

      function consumedHours(studentId = 'ST-1') {
        return -state.ledger.filter(l => l.studentId === studentId && l.type === 'consumption').reduce((sum, l) => sum + l.hours, 0);
      }

      function committedFutureHours(studentId = 'ST-1') {
        const now = Date.now();
        return studentBookings(studentId).reduce((sum, b) => {
          const s = sessionById(b.sessionId);
          if (!s || b.replacementFor || attendanceFor(s.id, studentId)) return sum;
          if (new Date(s.start).getTime() > now) return sum + durationHours(s);
          return sum;
        }, 0);
      }

      function packageAvailableForBooking(studentId = 'ST-1') {
        return Math.max(0, ledgerBalance(studentId) - committedFutureHours(studentId));
      }

      function canProviderHost(s) {
        const t = teacher(s.teacherId);
        if (!t || !t.ready) return { ok: false, message: 'المعلم غير جاهز للحصص الأونلاين.' };
        if (t.providerKind === 'zoomBasic' && s.duration > 40) {
          return { ok: false, message: 'Zoom Basic محدود بـ 40 دقيقة. لا يوجد التفاف باجتماعات متتالية.' };
        }
        if (t.providerKind === 'googleFree' && s.capacity > 1 && s.duration > 60) {
          return { ok: false, message: 'Google Meet المجاني للحصص الجماعية حتى 60 دقيقة.' };
        }
        return { ok: true, message: 'جاهز' };
      }

      function provisionMeeting(s, mode) {
        const provider = canProviderHost(s);
        if (!provider.ok) return provider;
        s.meetingStatus = 'ready';
        state.meetingLog.unshift({
          id: 'ML-' + Date.now(),
          sessionId: s.id,
          mode,
          text: mode === 'teacher' ? 'محاكاة بدء حصة من حساب المعلم المتصل' : 'محاكاة وصول مشارك بعد Join مصرح',
          at: new Date().toISOString()
        });
        return { ok: true, message: 'تم إنشاء/تجهيز الاجتماع محليًا كمحاكاة.' };
      }

      function bookSession(sessionId, quiet = false) {
        const st = student();
        const s = sessionById(sessionId);
        if (!s) return toast('الحصة غير موجودة.');
        if (s.level !== st.level) return toast('لا يمكن حجز حصة من مستوى مختلف.');
        if (new Date(s.start).getTime() <= Date.now()) return toast('لا يمكن حجز حصة بدأت أو انتهت.');
        if (seatsTaken(s.id) >= s.capacity) return toast('لا توجد مقاعد متاحة.');
        if (studentBookings(st.id).some(b => b.sessionId === s.id)) return toast('هذه الحصة محجوزة مسبقًا.');
        if (packageAvailableForBooking(st.id) < durationHours(s)) return toast('الحجز يتجاوز الساعات المتاحة بعد احتساب الحجوزات المستقبلية.');
        state.bookings.push({ id: 'B-' + Date.now(), studentId: st.id, sessionId: s.id, status: 'active', replacementFor: null, bookedBy: 'student', createdAt: new Date().toISOString() });
        saveState();
        if (!quiet) toast('تم حجز الحصة. ظهرت فورًا في بوابة الطالب وولي الأمر والمعلم.');
        render();
      }

      function cancelBooking(sessionId) {
        const b = studentBookings().find(x => x.sessionId === sessionId);
        const s = sessionById(sessionId);
        if (!b || !s) return toast('لا يوجد حجز فعال لهذه الحصة.');
        if (new Date(s.start).getTime() <= Date.now()) return toast('لا يمكن إلغاء حصة بدأت أو انتهت في هذا المحاكي.');
        b.status = 'cancelled';
        b.cancelledAt = new Date().toISOString();
        saveState();
        toast('تم إلغاء الحجز المستقبلي دون خصم.');
        render();
      }

      function joinSession(sessionId, quiet = false) {
        const st = student();
        const s = sessionById(sessionId);
        const b = studentBookings(st.id).find(x => x.sessionId === sessionId);
        if (!s || !b) return toast('لا يمكن الدخول: الطالب غير مسجل في هذه الحصة.');
        const existing = attendanceFor(sessionId, st.id);
        if (existing?.present) {
          if (!quiet) toast('Join مكرر: الحضور مسجل سابقًا ولا يوجد خصم ثان.');
          openMeetingModal('Join مكرر', 'تم إثبات idempotency: لا خصم إضافي ولا رابط مضيف.');
          return;
        }
        if (existing && !existing.present) return toast('هذه الحصة أغلقت كغياب. استخدم طلب التعويض.');
        const now = Date.now();
        const start = new Date(s.start).getTime();
        const end = start + s.duration * 60000;
        if (now < start) return toast('لم يحن وقت Join بعد. يمكن استخدام زر محاكاة وصول الموعد للحصة البديلة.');
        if (now > end) return toast('انتهت نافذة الحضور. شغّل إغلاق الحصص المنتهية لتسجيل الغياب.');

        state.attendance.push({ id: 'A-' + Date.now(), studentId: st.id, sessionId: s.id, present: true, replacementFor: b.replacementFor, at: new Date().toISOString() });
        if (!b.replacementFor) {
          state.ledger.push({ id: 'L-' + Date.now(), studentId: st.id, type: 'consumption', packageId: 'PKG-1', hours: -durationHours(s), sessionId: s.id, note: 'حضور Join - خصم ساعة واحدة', at: new Date().toISOString() });
        }
        addPayrollForSession(s, b.replacementFor ? 'حصة بديلة مجانية للطالب' : 'حضور طالب');
        const provision = provisionMeeting(s, 'student');
        saveState();
        if (!quiet) toast(b.replacementFor ? 'تم دخول الحصة البديلة مجانًا دون خصم جديد.' : 'تم تسجيل الحضور واستهلاك ساعة واحدة.');
        openMeetingModal('محاكاة Join للطالب', provision.ok
          ? 'تم منح الطالب وصول مشارك فقط بعد فحوص الهوية والحجز والتوقيت والرصيد. لا يتم عرض رابط حقيقي.'
          : 'تم تسجيل الحضور محليًا، لكن تجهيز الاجتماع فشل في المحاكاة: ' + provision.message);
        render();
      }

      function makeJoinable(sessionId) {
        const s = sessionById(sessionId);
        if (!s) return;
        const now = Date.now();
        s.start = new Date(now - 5 * 60000).toISOString();
        saveState();
        toast('تمت محاكاة وصول موعد الحصة. يمكن الضغط على Join الآن.');
        render();
      }

      function finalizeNoShows(quiet = false) {
        let count = 0;
        const now = Date.now();
        for (const b of state.bookings.filter(x => x.status === 'active')) {
          const s = sessionById(b.sessionId);
          if (!s || attendanceFor(s.id, b.studentId)) continue;
          const end = new Date(s.start).getTime() + s.duration * 60000;
          if (end <= now) {
            state.attendance.push({ id: 'A-' + Date.now() + '-' + count, studentId: b.studentId, sessionId: s.id, present: false, replacementFor: b.replacementFor, at: new Date().toISOString() });
            if (!b.replacementFor) {
              state.ledger.push({ id: 'L-' + Date.now() + '-' + count, studentId: b.studentId, type: 'consumption', packageId: 'PKG-1', hours: -durationHours(s), sessionId: s.id, note: 'غياب No-show محجوز ذاتيًا - خصم ساعة', at: new Date().toISOString() });
            }
            s.status = 'completed';
            state.notifications.unshift({ id: 'N-' + Date.now(), userId: 'u-student', text: 'تم تسجيل غياب عن حصة محجوزة ذاتيًا. يمكن تقديم طلب تعويض.', channel: 'داخل المحاكي', status: 'shown', at: new Date().toISOString() });
            count++;
          }
        }
        saveState();
        if (!quiet) toast(count ? `تم إغلاق ${count} حصة منتهية وتسجيل الغياب.` : 'لا توجد حصص منتهية تحتاج إغلاقًا.');
        render();
      }

      function requestCompensation(sessionId, quiet = false) {
        const st = student();
        const att = attendanceFor(sessionId, st.id);
        if (!att || att.present) return toast('لا يمكن طلب التعويض إلا عن غياب مسجل.');
        if (state.compensationRequests.some(r => r.studentId === st.id && r.originalSessionId === sessionId && r.status !== 'rejected')) {
          return toast('يوجد طلب مفتوح أو موافق عليه لهذه الحصة.');
        }
        state.compensationRequests.push({
          id: 'CR-' + Date.now(),
          studentId: st.id,
          originalSessionId: sessionId,
          reason: document.querySelector('[data-comp-reason]')?.value || 'سبب توضيحي اختياري داخل المحاكي',
          status: 'pending',
          replacementSessionId: null,
          requestedAt: new Date().toISOString()
        });
        saveState();
        if (!quiet) toast('تم تقديم طلب التعويض. ظهر فورًا في قائمة الأدمن.');
        render();
      }

      function approveRequest(requestId, sessionId) {
        const req = state.compensationRequests.find(r => r.id === requestId);
        const repl = sessionById(sessionId);
        const st = student(req?.studentId);
        if (!req || !repl || !st) return toast('الطلب أو الحصة البديلة غير موجودين.');
        if (req.status !== 'pending') return toast('هذا الطلب ليس بانتظار المراجعة.');
        if (repl.level !== st.level) return toast('الحصة البديلة يجب أن تكون من نفس المستوى.');
        if (new Date(repl.start).getTime() <= Date.now()) return toast('الحصة البديلة يجب أن تكون مستقبلية عند الموافقة.');
        if (seatsTaken(repl.id) >= repl.capacity) return toast('الحصة البديلة ممتلئة.');
        req.status = 'approved';
        req.replacementSessionId = repl.id;
        req.resolvedAt = new Date().toISOString();
        state.bookings.push({ id: 'B-R-' + Date.now(), studentId: st.id, sessionId: repl.id, status: 'active', replacementFor: req.originalSessionId, bookedBy: 'admin', createdAt: new Date().toISOString() });
        state.notifications.unshift({ id: 'N-' + Date.now(), userId: 'u-student', text: 'تمت الموافقة على حصة بديلة محددة. إشعار واتساب كان سيُضاف للطابور فقط بعد الموافقة - محاكاة ولم يُرسل شيء.', channel: 'WhatsApp محاكى', status: 'queued-simulated', at: new Date().toISOString() });
        state.notifications.unshift({ id: 'N-G-' + Date.now(), userId: 'u-guardian', text: 'تمت الموافقة على حصة بديلة لليان. إشعار محاكى فقط.', channel: 'WhatsApp محاكى', status: 'queued-simulated', at: new Date().toISOString() });
        saveState();
        toast('تمت الموافقة وربط التعويض بحصة محددة. لا توجد محفظة رصيد.');
        render();
      }

      function approveFirstPending(quiet = false) {
        const req = state.compensationRequests.find(r => r.status === 'pending');
        if (!req) return toast('لا يوجد طلب تعويض بانتظار الموافقة.');
        approveRequest(req.id, 'S-103');
        if (quiet) return;
      }

      function rejectRequest(requestId) {
        const req = state.compensationRequests.find(r => r.id === requestId);
        if (!req || req.status !== 'pending') return toast('لا يوجد طلب بانتظار الرفض.');
        req.status = 'rejected';
        req.rejectionReason = 'قرار توضيحي من الأدمن داخل المحاكي';
        req.resolvedAt = new Date().toISOString();
        saveState();
        toast('تم رفض الطلب محليًا. لا يتم إنشاء إشعار واتساب عند الرفض.');
        render();
      }

      function joinReplacementForTour() {
        const req = state.compensationRequests.find(r => r.status === 'approved' && r.replacementSessionId);
        if (!req) return toast('لا توجد حصة بديلة موافق عليها بعد.');
        makeJoinable(req.replacementSessionId);
        joinSession(req.replacementSessionId, true);
      }

      function addPackage() {
        const id = 'PKG-' + (state.packages.length + 1);
        const payId = 'PAY-' + (state.payments.length + 1);
        state.packages.push({ id, studentId: 'ST-1', label: 'باقة جديدة 10 ساعات - B1', purchasedHours: 10, createdAt: new Date().toISOString(), status: 'active', paymentId: payId });
        state.payments.push({ id: payId, studentId: 'ST-1', amount: 90, currency: 'JOD', method: 'تأكيد دفع محاكى', provider: 'مزود الدفع قيد الاختيار', status: 'confirmed', at: new Date().toISOString() });
        state.ledger.push({ id: 'L-' + Date.now(), studentId: 'ST-1', type: 'purchase', packageId: id, hours: 10, sessionId: null, note: 'شراء باقة جديدة - دورة حجز جديدة وليست تسجيلًا دائمًا', at: new Date().toISOString() });
        saveState();
        toast('تمت إضافة باقة جديدة مستقلة من 10 ساعات. لا يوجد تسجيل دائم في جدول متكرر.');
        render();
      }

      function addPayrollForSession(s, note) {
        if (state.payroll.some(p => p.sessionId === s.id)) return;
        state.payroll.push({ id: 'PR-' + Date.now(), teacherId: s.teacherId, sessionId: s.id, amount: durationHours(s) * 7.5, currency: 'JOD', status: 'بانتظار الاعتماد', note });
      }

      function simulateTeacherConnect(teacherId, providerKind) {
        const t = teacher(teacherId);
        if (!t) return;
        const map = {
          paidZoom: ['Zoom مدفوع', 'Zoom', 'حصص كاملة المدة'],
          zoomBasic: ['Zoom Basic', 'Zoom', 'حد أقصى 40 دقيقة'],
          googleFree: ['Google Meet مجاني', 'Google Meet', '1:1 حتى 24 ساعة، جماعي حتى 60 دقيقة']
        };
        const chosen = map[providerKind];
        t.providerKind = providerKind;
        t.provider = chosen[0];
        t.defaultProvider = chosen[1];
        t.capability = chosen[2];
        t.ready = true;
        saveState();
        toast('تم تحديث اتصال الفيديو محليًا كمحاكاة فقط.');
        render();
      }

      function startTeacherSession(sessionId) {
        const u = currentUser();
        const s = sessionById(sessionId);
        if (!u?.teacherId || !s || s.teacherId !== u.teacherId) return toast('المعلم يرى حصصه فقط.');
        const provision = provisionMeeting(s, 'teacher');
        saveState();
        if (!provision.ok) return toast(provision.message);
        openMeetingModal('بدء الحصة - محاكاة', 'المعلم يحصل على إجراء Start session محلي فقط. لا يوجد رابط Zoom/Google حقيقي ولا start_url أو token.');
        render();
      }

      function answerPlacementQuestion(raw) {
        const [questionId, index] = raw.split(':');
        state.placementTest.answers[questionId] = Number(index);
        state.placementTest.submitted = false;
        saveState();
        render();
      }

      function submitPlacementTest() {
        const test = state.placementTest;
        if (Object.keys(test.answers).length < test.questions.length) {
          return toast('أكمل كل أسئلة الاختبار أولاً.');
        }
        test.submitted = true;
        const score = placementScore();
        const st = student();
        st.placementScore = score;
        st.recommendedLevel = score >= 70 ? 'B1' : 'A2';
        state.notifications.unshift({
          id: 'N-T-' + Date.now(),
          userId: 'u-student',
          text: `تم تسليم اختبار المستوى محليًا. النتيجة ${score}% والمستوى المقترح ${st.recommendedLevel}.`,
          channel: 'اختبار المستوى',
          status: 'shown',
          at: new Date().toISOString()
        });
        saveState();
        toast('تم تسليم اختبار المستوى وتحديث صفحة التقدم.');
        render();
      }

      function toast(message) {
        const area = document.getElementById('toasts');
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = message;
        area.appendChild(el);
        setTimeout(() => el.remove(), 4200);
      }

      function openMeetingModal(title, text) {
        const dlg = document.getElementById('demoDialog');
        dlg.innerHTML = `
          <div class="modal-card">
            <h3>${h(title)}</h3>
            <p>${h(text)}</p>
            <div class="notice warn">محاكاة فقط: لا يتم فتح Zoom أو Google Meet ولا يتم عرض أسرار أو روابط حقيقية.</div>
            <div class="modal-actions"><button type="button" data-close-dialog>إغلاق</button></div>
          </div>`;
        dlg.querySelector('[data-close-dialog]').addEventListener('click', () => dlg.close());
        dlg.showModal();
      }

      function startTour() {
        state.tour = { active: true, index: 0 };
        state.currentUserId = userByRole('admin').id;
        state.activeSection = 'overview';
        saveState();
        render();
      }

      function tourNext(runAction = false) {
        const step = tourSteps[state.tour.index];
        if (runAction && step[3]) step[3]();
        state.tour.index = Math.min(tourSteps.length - 1, state.tour.index + 1);
        const next = tourSteps[state.tour.index];
        const user = userByRole(next[0]);
        state.currentUserId = user.id;
        state.activeSection = next[1];
        saveState();
        render();
      }

      function exitTour() {
        state.tour.active = false;
        saveState();
        render();
      }

      function applyFileRoute() {
        const file = (window.location.pathname.split('/').pop() || 'index.html').toLowerCase();
        const routes = {
          'portal_dashboard.html': 'studentDashboard',
          'portal_classes.html': 'studentClasses',
          'portal_attendance.html': 'studentAttendance',
          'portal_apology.html': 'studentApology',
          'portal_finance.html': 'studentFinance',
          'portal_profile.html': 'studentProfile',
          'portal_progress.html': 'studentProgress',

      function nextStudentSessionCard() {
        const now = Date.now();
        const next = studentBookings().map(b => sessionById(b.sessionId)).filter(Boolean)
          .sort((a, b) => new Date(a.start).getTime() - new Date(b.start).getTime())
          .find(s => new Date(s.start).getTime() + s.duration * 60000 > now);
        if (!next) return '<div class="empty">لا توجد حصة قادمة بعد. احجز من صفحة الحصص.</div>';
        return itemCard(next.title, `${fmtDate(next.start)}<br>${sessionStatus(next, attendanceFor(next.id), studentBookings().find(b => b.sessionId === next.id))}`);
      }

      function notificationList(userId, limit = 99) {
        const rows = state.notifications.filter(n => n.userId === userId).slice(0, limit);
        return rows.map(n => `<article class="item-card"><div class="row"><strong>${h(n.channel)}</strong><span class="badge info">${h(n.status)}</span></div><small>${fmtDate(n.at)}</small><p>${h(n.text)}</p></article>`).join('') || '<div class="empty">لا توجد تنبيهات.</div>';
      }

      function attendanceTimeline() {
        const rows = state.attendance.filter(a => a.studentId === 'ST-1');

        return `<div class="timeline">${rows.map(a => {
          const s = sessionById(a.sessionId);
          return `<div class="timeline-row">
            <time>${fmtDate(a.at)}</time>
            <div><strong>${h(s?.title || a.sessionId)}</strong><br><small>${a.replacementFor ? 'حصة بديلة مرتبطة' : 'حصة أصلية'}</small></div>

      function compensationSummary(studentId) {
        const rows = state.compensationRequests.filter(r => r.studentId === studentId);
        if (!rows.length) return '<div class="empty">لا توجد طلبات تعويض بعد.</div>';
        return rows.map(r => {
          const original = sessionById(r.originalSessionId);
          const replacement = r.replacementSessionId ? sessionById(r.replacementSessionId) : null;
          return itemCard(r.id, `${statusBadge(r.status)}<br>الأصلية: ${h(original?.title || r.originalSessionId)}<br>${replacement ? 'البديلة: ' + h(replacement.title) : 'لم تحدد حصة بديلة بعد.'}`);

      function progressStep(title, status, at, badge) {
        return `<div class="timeline-row"><time>${fmtDate(at)}</time><div><strong>${h(title)}</strong><br><small>${h(status)}</small></div><span class="badge ${h(badge)}">${h(status)}</span></div>`;
      }

      function placementScore() {
        const test = state.placementTest;
        const correct = test.questions.filter(q => test.answers[q.id] === q.correct).length;
        return Math.round((correct / test.questions.length) * 100);
      }

      function availableSessions() {
        const st = student();
        const booked = new Set(studentBookings(st.id).map(b => b.sessionId));
        return state.sessions.filter(s =>
          s.level === st.level &&
          s.status === 'scheduled' &&
          new Date(s.start).getTime() > Date.now() &&
          seatsTaken(s.id) < s.capacity &&
          !booked.has(s.id)
        );
      }

      function sessionsTable(rows, mode = 'admin') {
        const htmlRows = rows.map(s => {
          const t = teacher(s.teacherId);
          const att = attendanceFor(s.id);
          const booking = studentBookings().find(b => b.sessionId === s.id);
          return `<tr>
            <td><strong>${h(s.id)}</strong><br>${h(s.title)}</td>
            <td>${h(s.level)}</td>
            <td>${h(t.name)}<br><small>${h(t.provider)}</small></td>
            <td>${fmtDate(s.start)}<br><small>${s.duration} دقيقة</small></td>
            <td>${seatsTaken(s.id)} / ${s.capacity}</td>
            <td>${sessionStatus(s, att, booking)}</td>
            <td>${sessionActions(s, mode, booking, att)}</td>
          </tr>`;
        }).join('');
        const mobile = rows.map(s => {
          const att = attendanceFor(s.id);
          const booking = studentBookings().find(b => b.sessionId === s.id);
          return itemCard(`${s.id} · ${s.title}`, `${fmtDate(s.start)}<br>${sessionStatus(s, att, booking)}<div class="panel-actions">${sessionActions(s, mode, booking, att)}</div>`);
        }).join('');
        return `<div class="table-wrap"><table><thead><tr><th>الحصة</th><th>المستوى</th><th>المعلم</th><th>الوقت</th><th>السعة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${htmlRows || '<tr><td colspan="7">لا توجد بيانات.</td></tr>'}</tbody></table></div><div class="mobile-list">${mobile || '<div class="empty">لا توجد بيانات.</div>'}</div>`;
      }

      function sessionActions(s, mode, booking, att) {
        const actions = [];
        if (mode === 'book') actions.push(`<button type="button" class="btn-small" data-book="${h(s.id)}">حجز</button>`);
        if (mode === 'student') {
          if (booking && new Date(s.start).getTime() > Date.now() && !att) actions.push(`<button type="button" class="btn-small btn-secondary" data-cancel-booking="${h(s.id)}">إلغاء الحجز</button>`);
          if (booking && new Date(s.start).getTime() > Date.now()) actions.push(`<button type="button" class="btn-small btn-soft" data-make-joinable="${h(s.id)}">محاكاة وصول الموعد</button>`);
          actions.push(`<button type="button" class="btn-small" data-join="${h(s.id)}">Join - محاكاة</button>`);
        }
        if (mode === 'teacher') actions.push(`<button type="button" class="btn-small" data-start-session="${h(s.id)}">بدء الحصة - محاكاة</button>`);
        if (mode === 'guardian') actions.push('<span class="badge neutral">عرض فقط</span>');
        if (mode === 'admin') actions.push('<span class="badge neutral">إدارة من التبويبات</span>');
        return actions.join(' ');
      }

      function sessionStatus(s, att, booking) {
        const provider = canProviderHost(s);
        const parts = [];
        parts.push(s.status === 'completed' ? '<span class="badge neutral">مكتملة</span>' : '<span class="badge info">مجدولة</span>');
        if (booking?.replacementFor) parts.push('<span class="badge ok">بديلة مرتبطة</span>');
        if (att?.present) parts.push('<span class="badge ok">حضور</span>');
        if (att && !att.present) parts.push('<span class="badge bad">No-show مستهلك</span>');
        if (!provider.ok) parts.push(`<span class="badge bad">${h(provider.message)}</span>`);
        if (s.meetingStatus === 'ready') parts.push('<span class="badge ok">اجتماع محاكى جاهز</span>');
        return parts.join(' ');
      }

      function replacementSelect(req) {
        const st = student(req.studentId);
        const options = state.sessions.filter(s => s.level === st.level && new Date(s.start).getTime() > Date.now() && seatsTaken(s.id) < s.capacity)
          .map(s => `<option value="${h(s.id)}">${h(s.id)} - ${h(s.title)} - ${fmtDate(s.start)}</option>`).join('');
        return `<label class="sr-only" for="repl-${h(req.id)}">الحصة البديلة</label><select id="repl-${h(req.id)}" data-replacement-select="${h(req.id)}">${options}</select>
          <button type="button" class="btn-small" data-approve="${h(req.id)}">موافقة</button>
          <button type="button" class="btn-small btn-danger" data-reject="${h(req.id)}">رفض</button>`;
      }

          ${state.ledger.filter(l => l.studentId === 'ST-1').map(l => `<tr><td>${fmtDate(l.at)}</td><td>${h(l.type)}</td><td>${l.hours}</td><td>${h(l.sessionId || '—')}</td><td>${h(l.note)}</td></tr>`).join('')}

      function paymentsTable() {
        return `<div class="table-wrap"><table><thead><tr><th>رقم</th><th>الطالب</th><th>المبلغ</th><th>الطريقة</th><th>المزود</th><th>الحالة</th></tr></thead><tbody>
          ${state.payments.map(p => `<tr><td>${h(p.id)}</td><td>${h(student(p.studentId).name)}</td><td>${fmtMoney(p.amount, p.currency)}</td><td>${h(p.method)}</td><td><span class="badge warn">${h(p.provider)}</span></td><td>${statusBadge(p.status)}</td></tr>`).join('')}
        </tbody></table></div>`;

      function payrollTable(rows) {
        return rows.length ? `<div class="table-wrap"><table><thead><tr><th>السطر</th><th>المعلم</th><th>الحصة</th><th>المبلغ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>
          ${rows.map(p => `<tr><td>${h(p.id)}</td><td>${h(teacher(p.teacherId).name)}</td><td>${h(p.sessionId)}</td><td>${fmtMoney(p.amount, p.currency)}</td><td>${statusBadge(p.status)}</td><td>${h(p.note)}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">لا توجد سطور راتب لهذا العرض.</div>';

      function statusBadge(status) {
        const s = String(status);
        const cls = s.includes('approved') || s.includes('confirmed') || s.includes('مدفوع') ? 'ok' :
          s.includes('pending') || s.includes('بانتظار') || s.includes('queued') ? 'warn' :
          s.includes('rejected') ? 'bad' : 'neutral';
        const ar = { pending: 'بانتظار المراجعة', approved: 'موافق عليه', rejected: 'مرفوض', confirmed: 'مؤكد' }[s] || s;
        return `<span class="badge ${cls}">${h(ar)}</span>`;
      }

          admin: 'إدارة كاملة للسيناريو، الموافقات، التقارير، والتكاملات.',

          student: 'حجز ذاتي، Join، غياب، طلب تعويض، وشهادة.',
          guardian: 'متابعة الابنة والباقات والحضور دون صلاحية Join.'

      function bindActions() {
        document.querySelectorAll('[data-login]').forEach(b => b.addEventListener('click', () => setUser(b.dataset.login)));
        document.querySelectorAll('[data-section]').forEach(b => b.addEventListener('click', () => setSection(b.dataset.section)));
        document.querySelectorAll('[data-switch]').forEach(b => b.addEventListener('click', () => { state.currentUserId = null; saveState(); render(); }));
        document.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', resetDemo));
        document.querySelectorAll('[data-start-tour]').forEach(b => b.addEventListener('click', startTour));
        document.querySelectorAll('[data-tour-next]').forEach(b => b.addEventListener('click', () => tourNext(false)));
        document.querySelectorAll('[data-tour-action]').forEach(b => b.addEventListener('click', () => tourNext(true)));
        document.querySelectorAll('[data-exit-tour]').forEach(b => b.addEventListener('click', exitTour));
        document.querySelectorAll('[data-book]').forEach(b => b.addEventListener('click', () => bookSession(b.dataset.book)));
        document.querySelectorAll('[data-join]').forEach(b => b.addEventListener('click', () => joinSession(b.dataset.join)));
        document.querySelectorAll('[data-cancel-booking]').forEach(b => b.addEventListener('click', () => cancelBooking(b.dataset.cancelBooking)));
        document.querySelectorAll('[data-finalize]').forEach(b => b.addEventListener('click', () => finalizeNoShows()));
        document.querySelectorAll('[data-request-comp]').forEach(b => b.addEventListener('click', () => requestCompensation(b.dataset.requestComp)));
        document.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', () => {
          const select = document.querySelector(`[data-replacement-select="${CSS.escape(b.dataset.approve)}"]`);
          approveRequest(b.dataset.approve, select.value);
        }));
        document.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', () => rejectRequest(b.dataset.reject)));
        document.querySelectorAll('[data-add-package]').forEach(b => b.addEventListener('click', addPackage));
        document.querySelectorAll('[data-connect-provider]').forEach(b => b.addEventListener('click', () => {
          const [teacherId, kind] = b.dataset.connectProvider.split(':');
          simulateTeacherConnect(teacherId, kind);
        }));
        document.querySelectorAll('[data-start-session]').forEach(b => b.addEventListener('click', () => startTeacherSession(b.dataset.startSession)));
        document.querySelectorAll('[data-make-joinable]').forEach(b => b.addEventListener('click', () => makeJoinable(b.dataset.makeJoinable)));
        document.querySelectorAll('[data-test-answer]').forEach(b => b.addEventListener('click', () => answerPlacementQuestion(b.dataset.testAnswer)));
        document.querySelectorAll('[data-submit-test]').forEach(b => b.addEventListener('click', submitPlacementTest));
      }

      if (memoryState && !state) state = memoryState;
      applyFileRoute();
      render();
    })();
  </script>
</body>
</html>
