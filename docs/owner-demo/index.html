<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>MVTeaches — نسخة توضيحية للمالك</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --brand:#1d4ed8; --brand-dark:#1e3a8a; --accent:#0d9488;
    --bg:#f3f5fb; --surface:#ffffff; --surface-2:#f8fafc;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --success:#15803d; --success-bg:#dcfce7;
    --warning:#b45309; --warning-bg:#fef3c7;
    --danger:#b91c1c; --danger-bg:#fee2e2;
    --info:#1d4ed8; --info-bg:#dbeafe;
    --neutral-bg:#f1f5f9;
    --radius:14px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px -14px rgba(15,23,42,.25);
    --focus:#0d9488;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Tahoma","Geeza Pro","Arial",sans-serif;
    line-height:1.55; min-height:100vh; overflow-x:hidden;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  button{font-family:inherit;}
  a{color:var(--brand);}
  h1,h2,h3,h4{margin:0 0 .4em 0; line-height:1.3;}
  p{margin:0 0 .6em 0;}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px;}
  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}

  /* ---------- demo banner ---------- */
  .demo-banner{
    background:linear-gradient(90deg,#fde68a,#fbbf24);
    color:#78350f; text-align:center; font-weight:700; font-size:.92rem;
    padding:8px 12px; letter-spacing:.2px; position:sticky; top:0; z-index:60;
    border-bottom:1px solid #d97706;
  }
  .demo-banner small{display:block; font-weight:500; font-size:.78rem; margin-top:2px;}

  /* ---------- login ---------- */
  .login-wrap{
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 60px; gap:28px; max-width:1100px; margin:0 auto; width:100%;
  }
  .login-hero{text-align:center; max-width:640px;}
  .login-hero h1{font-size:1.7rem; color:var(--brand-dark);}
  .login-hero p{color:var(--muted); font-size:.98rem;}
  .brand-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--brand);
    color:#fff; padding:6px 16px; border-radius:999px; font-weight:700; font-size:.85rem;
    margin-bottom:10px;
  }
  .role-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px; width:100%;
  }
  .role-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px; display:flex; flex-direction:column; gap:10px;
  }
  .role-avatar{
    width:52px; height:52px; border-radius:50%; background:var(--info-bg); color:var(--brand);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.15rem;
    flex-shrink:0;
  }
  .role-card h3{font-size:1.05rem;}
  .role-card .role-tag{
    display:inline-block; font-size:.72rem; font-weight:700; color:var(--accent);
    background:#ccfbf1; padding:2px 10px; border-radius:999px; width:fit-content;
  }
  .role-card .role-desc{color:var(--muted); font-size:.85rem; min-height:44px;}
  .cred-box{
    background:var(--surface-2); border:1px dashed var(--border); border-radius:var(--radius-sm);
    padding:8px 10px; font-size:.78rem; font-family:"Consolas",monospace; color:#334155;
  }
  .cred-box div{display:flex; justify-content:space-between; gap:8px;}
  .login-note{
    font-size:.78rem; color:var(--muted); text-align:center; max-width:640px;
  }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:999px; border:1px solid transparent; padding:9px 18px;
    font-size:.86rem; font-weight:700; cursor:pointer; transition:.15s;
    white-space:nowrap; line-height:1.2;
  }
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--brand-dark);}
  .btn-accent{background:var(--accent); color:#fff;}
  .btn-accent:hover:not(:disabled){background:#0b7d72;}
  .btn-outline{background:#fff; border-color:var(--border); color:var(--text);}
  .btn-outline:hover:not(:disabled){border-color:var(--brand); color:var(--brand);}
  .btn-danger{background:#fff; border-color:var(--danger); color:var(--danger);}
  .btn-danger:hover:not(:disabled){background:var(--danger-bg);}
  .btn-ghost{background:transparent; color:var(--muted); border-color:transparent; padding:6px 10px;}
  .btn-ghost:hover:not(:disabled){background:var(--neutral-bg); color:var(--text);}
  .btn-sm{padding:6px 12px; font-size:.78rem;}
  .btn-block{width:100%;}

  /* ---------- shell layout ---------- */
  .topbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px; padding:10px 16px; position:sticky; top:37px; z-index:50;
    flex-wrap:wrap;
  }
  .topbar .brand{display:flex; align-items:center; gap:8px; font-weight:800; color:var(--brand-dark); font-size:1.02rem;}
  .topbar .spacer{flex:1;}
  .role-switch{display:flex; gap:4px; background:var(--neutral-bg); padding:4px; border-radius:999px; flex-wrap:wrap;}
  .role-switch button{
    border:none; background:transparent; padding:6px 12px; border-radius:999px; font-size:.78rem;
    font-weight:700; color:var(--muted); cursor:pointer;
  }
  .role-switch button.active{background:var(--brand); color:#fff;}
  .clock-chip{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; padding:5px 6px 5px 12px; font-size:.78rem; color:var(--text);
  }
  .clock-chip strong{color:var(--brand-dark);}
  .topbar-actions{display:flex; gap:6px; flex-wrap:wrap;}

  .layout{display:flex; flex:1; min-height:0; align-items:stretch;}
  .sidebar{
    width:230px; flex-shrink:0; background:var(--surface); border-left:1px solid var(--border);
    padding:14px 10px; display:flex; flex-direction:column; gap:4px;
  }
  .sidebar button.nav-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:right; border:none;
    background:transparent; padding:10px 12px; border-radius:var(--radius-sm); font-size:.87rem;
    font-weight:600; color:var(--text); cursor:pointer;
  }
  .sidebar button.nav-item:hover{background:var(--neutral-bg);}
  .sidebar button.nav-item.active{background:var(--info-bg); color:var(--brand-dark);}
  .content{flex:1; min-width:0; padding:20px; display:flex; flex-direction:column; gap:16px;}

  /* ---------- cards / grid / stats ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
  .card h2{font-size:1.08rem; color:var(--brand-dark);}
  .card .card-sub{color:var(--muted); font-size:.82rem; margin-top:-6px; margin-bottom:12px;}
  .grid{display:grid; gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:620px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
  .stat .stat-label{font-size:.78rem; color:var(--muted); font-weight:700;}
  .stat .stat-value{font-size:1.5rem; font-weight:800; color:var(--brand-dark); margin-top:4px;}
  .stat .stat-hint{font-size:.74rem; color:var(--muted); margin-top:4px;}
  .progress{height:9px; background:var(--neutral-bg); border-radius:999px; overflow:hidden;}
  .progress > span{display:block; height:100%; background:var(--accent);}

  /* ---------- badges ---------- */
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px;}
  .badge-success{background:var(--success-bg); color:var(--success);}
  .badge-warning{background:var(--warning-bg); color:var(--warning);}
  .badge-danger{background:var(--danger-bg); color:var(--danger);}
  .badge-info{background:var(--info-bg); color:var(--info);}
  .badge-neutral{background:var(--neutral-bg); color:var(--muted);}

  /* ---------- tables ---------- */
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-sm);}
  table{width:100%; border-collapse:collapse; font-size:.85rem; min-width:560px;}
  thead th{background:var(--surface-2); text-align:right; padding:10px 12px; font-size:.76rem; color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap;}
  tbody td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}

  /* ---------- forms ---------- */
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .field label{font-size:.8rem; font-weight:700; color:var(--text);}
  .field .hint{font-size:.74rem; color:var(--muted);}
  .field .err{font-size:.74rem; color:var(--danger); font-weight:700;}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 10px; font-size:.86rem;
    background:#fff; color:var(--text); width:100%; font-family:inherit;
  }
  textarea{resize:vertical; min-height:70px;}
  .form-row{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media (max-width:620px){.form-row{grid-template-columns:1fr;}}
  fieldset{border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin:0 0 12px;}
  legend{padding:0 6px; font-size:.82rem; font-weight:700; color:var(--brand-dark);}
  .radio-option{display:flex; align-items:flex-start; gap:8px; padding:8px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px;}
  .radio-option input{margin-top:4px;}
  .radio-option:hover{border-color:var(--brand);}

  /* ---------- empty / info blocks ---------- */
  .empty-state{
    text-align:center; padding:32px 16px; color:var(--muted); border:1px dashed var(--border);
    border-radius:var(--radius); background:var(--surface-2);
  }
  .empty-state .icon{font-size:1.8rem; display:block; margin-bottom:8px;}
  .note-box{
    background:var(--info-bg); border:1px solid #bfdbfe; color:#1e3a8a; border-radius:var(--radius-sm);
    padding:10px 12px; font-size:.82rem;
  }
  .warn-box{
    background:var(--warning-bg); border:1px solid #fde68a; color:#78350f; border-radius:var(--radius-sm);
    padding:10px 12px; font-size:.82rem;
  }
  .sim-tag{font-size:.68rem; font-weight:800; color:#7c2d12; background:#ffedd5; border-radius:6px; padding:2px 7px;}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.55); display:flex; align-items:center;
    justify-content:center; padding:16px; z-index:200;
  }
  .modal{
    background:#fff; border-radius:var(--radius); max-width:560px; width:100%; max-height:88vh;
    overflow-y:auto; box-shadow:0 24px 60px -12px rgba(0,0,0,.4); padding:20px;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap;}

  /* ---------- toast ---------- */
  .toast-wrap{position:fixed; bottom:18px; right:18px; left:18px; display:flex; justify-content:center; z-index:300; pointer-events:none;}
  .toast{
    pointer-events:auto; max-width:420px; width:100%; background:#0f172a; color:#fff; border-radius:12px;
    padding:12px 16px; box-shadow:0 12px 30px -10px rgba(0,0,0,.5); display:flex; gap:10px; align-items:flex-start;
    font-size:.85rem; animation:toastin .18s ease-out;
  }
  @keyframes toastin{from{transform:translateY(10px);opacity:0} to{transform:translateY(0);opacity:1}}
  .toast.success{background:#065f46;} .toast.warn{background:#92400e;} .toast.danger{background:#7f1d1d;} .toast.info{background:#1e3a8a;}
  .toast button{background:transparent;border:none;color:#fff;opacity:.7;cursor:pointer;font-size:1rem;}

  /* ---------- tour ---------- */
  .tourbar{
    position:sticky; bottom:0; z-index:100; background:var(--brand-dark); color:#fff;
    padding:12px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; box-shadow:0 -8px 20px -12px rgba(0,0,0,.4);
  }
  .tourbar .tstep{background:#fff; color:var(--brand-dark); font-weight:800; border-radius:999px; padding:3px 12px; font-size:.78rem;}
  .tourbar .ttext{flex:1; min-width:220px; font-size:.86rem;}
  .tour-flash{animation:tourflash 1.4s ease-in-out 2;}
  @keyframes tourflash{0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,0)} 50%{box-shadow:0 0 0 6px rgba(13,148,136,.45)}}

  .child-switch{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:2px;}
  .child-switch button{
    border:1px solid var(--border); background:#fff; border-radius:999px; padding:7px 16px; font-size:.82rem;
    font-weight:700; cursor:pointer; color:var(--text);
  }
  .child-switch button.active{background:var(--brand); border-color:var(--brand); color:#fff;}

  .kv{display:flex; justify-content:space-between; gap:10px; font-size:.85rem; padding:6px 0; border-bottom:1px dashed var(--border);}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);}
  .kv .v{font-weight:700;}

  .meet-tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0;}
  .meet-tile{aspect-ratio:1/1; background:linear-gradient(135deg,#1e3a8a,#0d9488); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:1.1rem;}

  @media (max-width:900px){
    .layout{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; border-left:none; border-bottom:1px solid var(--border); padding:8px;}
    .sidebar button.nav-item{white-space:nowrap; width:auto;}
    .topbar{top:53px;}
    .content{padding:14px;}
  }
</style>
</head>

/* ======================================================================
   2. UTILITIES
   ====================================================================== */
function pad(n){ return (n<10?"0":"")+n; }
function parseLocal(iso){ return new Date(iso); }
function toLocalISO(d){
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
function addMinutes(iso, mins){
  var d = parseLocal(iso);
  d.setMinutes(d.getMinutes()+mins);
  return toLocalISO(d);
}
var AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var AR_DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function fmtDate(iso){
  var d = parseLocal(iso);
  return AR_DAYS[d.getDay()]+"، "+d.getDate()+" "+AR_MONTHS[d.getMonth()]+" "+d.getFullYear();
}
function fmtTime(iso){
  var d = parseLocal(iso);
  var h = d.getHours(); var m = d.getMinutes();
  var ampm = h>=12 ? "م" : "ص";
  var h12 = h%12; if(h12===0) h12=12;
  return h12+":"+pad(m)+" "+ampm;
}
function fmtDateTime(iso){ return fmtDate(iso)+" — "+fmtTime(iso); }
function fmtShortDate(iso){
  var d = parseLocal(iso);
  return d.getDate()+" "+AR_MONTHS[d.getMonth()];
}
function fmtCurrency(amount, currency){
  var n = Math.round(amount*100)/100;
  var label = currency==="JOD" ? "د.أ" : (currency==="USD" ? "$" : currency);
  return n+" "+label;
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
var uidSeq = 1000;
function uid(prefix){ uidSeq++; return prefix+"-"+uidSeq; }

/* ======================================================================
   3. STATE — load / persist
   ====================================================================== */
var state = null;
function loadState(){
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && parsed.meta && parsed.meta.version===1) return parsed;
    }
  }catch(e){
    memoryOnly = true;
  }
  return buildSeed();
}
function persist(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    memoryOnly = true;
  }
}
state = loadState();

var runtime = {
  toast:null,
  modal:null,
  tour:{ active:false, step:0 },
  flashTarget:null
};
var toastSeq = 0;
function setToast(message, type){
  toastSeq++;
  var id = toastSeq;
  runtime.toast = {id:id, message:message, type:type||"info"};
  window.setTimeout(function(){
    if(runtime.toast && runtime.toast.id===id){ runtime.toast=null; render(); }
  }, 3600);
}
function setModal(obj){ runtime.modal = obj; }
function closeModalAction(){ runtime.modal = null; render(); }

/* ======================================================================
   5. LOOKUPS & DERIVED HELPERS
   ====================================================================== */
function byId(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } return null; }
function getLevel(id){ return byId(state.levels,id); }
function getTeacher(id){ return byId(state.teachers,id); }
function getStudent(id){ return byId(state.students,id); }
function getGuardian(id){ return byId(state.guardians,id); }
function getPackage(id){ return byId(state.packages,id); }
function getSession(id){ return byId(state.sessions,id); }
function getBooking(id){ return byId(state.bookings,id); }
function getCompReq(id){ return byId(state.compensationRequests,id); }
function levelName(id){ var l=getLevel(id); return l?l.name:id; }
function teacherName(id){ var t=getTeacher(id); return t?t.name:id; }
function studentName(id){ var s=getStudent(id); return s?s.name:id; }

function sessionEndISO(s){ return addMinutes(s.startISO, s.durationMinutes); }
function now(){ return parseLocal(state.clock); }
function isFutureSession(s){ return parseLocal(s.startISO) > now(); }
// "Over" means the session's end time has passed. This is deliberately NOT the negation of
// isFutureSession(): a session that has started but not yet ended is neither "future" (for
// booking purposes, correctly) nor "over" (for join/start/roster purposes) -- it is live right
// now, and a teacher or student mid-session must still see the Start/Join button. Confusing
// these two checks was the exact cause of a real reported bug (a booked, not-yet-joined session
// vanishing from "my upcoming sessions" the moment it started).
function isSessionOver(s){ return now() >= parseLocal(sessionEndISO(s)); }
function sessionPhase(s){
  if(parseLocal(s.startISO) > now()) return "upcoming";
  if(!isSessionOver(s)) return "live";
  return "over";
}
function occupiedCount(sessionId){
  var n=0;
  for(var i=0;i<state.bookings.length;i++){
    var b=state.bookings[i];
    if(b.sessionId===sessionId && (b.status==="Booked"||b.status==="Attended"||b.status==="NoShow")) n++;
  }
  return n;
}
function seatsAvailable(sessionId){
  var s=getSession(sessionId); if(!s) return 0;
  return Math.max(0, s.capacity - occupiedCount(sessionId));
}
function studentBookingForSession(studentId,sessionId){
  for(var i=0;i<state.bookings.length;i++){
    var b=state.bookings[i];
    if(b.studentId===studentId && b.sessionId===sessionId && b.status!=="Cancelled") return b;
  }
  return null;
}
function bookingsForStudent(studentId){
  return state.bookings.filter(function(b){ return b.studentId===studentId; });
}
function sessionsForTeacher(teacherId){
  return state.sessions.filter(function(s){ return s.teacherId===teacherId; });
}
function getActivePackage(studentId){
  var list = state.packages.filter(function(p){ return p.studentId===studentId && p.remainingHours>0; });
  list.sort(function(a,b){ return parseLocal(a.purchasedAtISO)-parseLocal(b.purchasedAtISO); });
  return list[0]||null;
}
function packagesForStudent(studentId){
  var list = state.packages.filter(function(p){ return p.studentId===studentId; });
  list.sort(function(a,b){ return parseLocal(b.purchasedAtISO)-parseLocal(a.purchasedAtISO); });
  return list;
}
function providerMeta(type){ return PROVIDER_META[type]||PROVIDER_META.none; }
function isTeacherReady(teacherId){
  var t=getTeacher(teacherId);
  return !!(t && t.provider.status==="Connected" && t.provider.type!=="none");
}
function maxDurationForTeacher(t, capacity){
  if(t.provider.type==="zoom_basic") return 40;
  if(t.provider.type==="google_meet") return capacity>1 ? 60 : 1440;
  if(t.provider.type==="zoom_paid") return 120;
  return 0;
}
function pushNotification(obj){
  obj.id = uid("N");
  obj.createdAtISO = state.clock;
  obj.read = false;
  state.notifications.push(obj);
}
function pushAudit(text){
  state.auditLog.unshift({id:uid("AUD"), text:text, atISO:state.clock});
}
function notificationsForStudent(sid){
  return state.notifications.filter(function(n){ return n.audience==="student" && n.studentId===sid; })
    .sort(function(a,b){ return parseLocal(b.createdAtISO)-parseLocal(a.createdAtISO); });
}
function derivePayroll(){
  var rows = [];
  state.bookings.forEach(function(b){
    if(b.status!=="Attended") return;
    var s = getSession(b.sessionId); if(!s) return;
    var t = getTeacher(s.teacherId); if(!t) return;
    var already = rows.find(function(r){ return r.sessionId===s.id && r.teacherId===t.id && r.studentId===b.studentId; });
    if(already) return;
    var hours = 1; // one package/attendance "hour" per attended session, matching the package-hour unit
    var amount = Math.round(hours*t.rate.amount*100)/100;
    rows.push({ teacherId:t.id, sessionId:s.id, studentId:b.studentId, date:s.startISO, hours:hours, rate:t.rate.amount, currency:t.rate.currency, amount:amount });
  });
  return rows;
}

/* ======================================================================
   6. BUSINESS RULES / ACTIONS
   ====================================================================== */
function settleNoShows(){
  var changed = false;
  state.bookings.forEach(function(b){
    if(b.status==="Booked"){
      var s = getSession(b.sessionId);
      if(s && now() >= parseLocal(sessionEndISO(s))){
        b.status="NoShow";
        if(b.packageId){
          var pkg = getPackage(b.packageId);
          if(pkg) pkg.remainingHours = Math.max(0, pkg.remainingHours-1);
        }
        pushNotification({audience:"student", studentId:b.studentId, kind:"noshow",
          text:"تم تسجيل غيابك عن حصة "+levelName(s.levelId)+" بتاريخ "+fmtDateTime(s.startISO)+"، وخُصمت الساعة تلقائيًا رغم عدم الحضور."});
        changed = true;
      }
    }
  });
  return changed;
}

function ensureBooking(sessionId){
  var existing = studentBookingForSession(STUDENT_ID, sessionId);
  if(existing) return existing;
  var pkg = getActivePackage(STUDENT_ID);
  var b = {id:uid("B"), studentId:STUDENT_ID, sessionId:sessionId, status:"Booked",
    packageId: pkg?pkg.id:null, createdAtISO:state.clock, attendedAtISO:null, isReplacement:false, compensationRequestId:null};
  state.bookings.push(b);
  return b;
}
/// Pure state mutation for "attend this booking" — shared by actions.joinSession (real click,
/// with toast/modal feedback) and the guided tour's forceComplete step-replay (silent, no
/// toast/modal, used only when the tour is fast-forwarded past a step the viewer didn't click
/// through manually). Callers are responsible for validating the join window first.
function forceJoin(bookingId){
  var b = getBooking(bookingId);
  if(!b || b.status !== "Booked") return;
  var s = getSession(b.sessionId);
  b.status = "Attended";
  b.attendedAtISO = state.clock;
  var student = getStudent(b.studentId);
  student.totalAttendedHours += 1;
  if(b.packageId){
    var pkg = getPackage(b.packageId);
    if(pkg) pkg.remainingHours = Math.max(0, pkg.remainingHours-1);
  }
  pushNotification({audience:"student", studentId:b.studentId, kind:"attended",
    text:"تم تسجيل حضورك في حصة "+levelName(s.levelId)+" بتاريخ "+fmtDateTime(s.startISO)+"."+(b.isReplacement?" (حصة تعويضية — دون أي خصم إضافي)":"")});
  pushAudit((b.isReplacement?"انضمام إلى حصة تعويضية: ":"انضمام: ")+studentName(b.studentId)+" — "+s.id);
}
function ensureCompensationRequest(){
  settleNoShows();
  var missed = state.bookings.find(function(b){ return b.studentId===STUDENT_ID && b.sessionId==="SES-202" && b.status==="NoShow"; });
  if(!missed) return null;
  var existing = state.compensationRequests.find(function(r){ return r.bookingId===missed.id; });
  if(existing) return existing;
  var req = {id:uid("CR"), studentId:STUDENT_ID, bookingId:missed.id, status:"Pending", reason:"سبب الغياب: ظرف عائلي طارئ (بيانات وهمية).",
    requestedAtISO:state.clock, decidedAtISO:null, decidedBy:null, rejectionReason:null, replacementSessionId:null, replacementBookingId:null};
  state.compensationRequests.push(req);
  missed.compensationRequestId = req.id;
  return req;
}
function findApprovedReq(){
  return state.compensationRequests.find(function(r){ return r.studentId===STUDENT_ID && r.status==="Approved"; }) || null;
}
function ensureCompensationApproved(){
  var req = ensureCompensationRequest();
  if(!req) return null;
  if(req.status==="Approved") return req;
  var sessionId = "SES-203";
  if(seatsAvailable(sessionId)<=0){
    var missedSessionId = req.bookingId ? getBooking(req.bookingId).sessionId : null;
    var alt = state.sessions.find(function(s){ return s.levelId==="B1" && s.id!==missedSessionId && isFutureSession(s) && seatsAvailable(s.id)>0; });
    if(alt) sessionId = alt.id;
  }
  var newBookingId = uid("B-CMP");
  state.bookings.push({id:newBookingId, studentId:STUDENT_ID, sessionId:sessionId, status:"Booked", packageId:null,
    createdAtISO:state.clock, attendedAtISO:null, isReplacement:true, compensationRequestId:req.id});
  req.status="Approved"; req.decidedAtISO=state.clock; req.decidedBy="الإدارة";
  req.replacementSessionId=sessionId; req.replacementBookingId=newBookingId;
  var s = getSession(sessionId);
  pushNotification({audience:"student", studentId:STUDENT_ID, kind:"comp-approved",
    text:"تمت الموافقة على طلب التعويض، وتم تحديد حصة بديلة: "+levelName(s.levelId)+" بتاريخ "+fmtDateTime(s.startISO)+"."});
  var student = getStudent(STUDENT_ID);
  state.whatsappOutbox.push({id:uid("WA"), to:student.phone,
    text:"مرحبًا، تم اعتماد حصة تعويضية جديدة بتاريخ "+fmtDateTime(s.startISO)+" (رسالة محاكاة — لم تُرسل فعليًا).",
    createdAtISO:state.clock, status:"queued-simulated"});
  pushAudit("الإدارة وافقت تلقائيًا (ضمن الجولة التعريفية) على طلب التعويض "+req.id);
  return req;
}

/* ======================================================================
   7. TOUR ENGINE
   ====================================================================== */
// Replays every step's `complete` up to (but not including) idx — in order, each idempotent —
// so landing on step idx always reflects the full outcome of every earlier step, regardless of
// whether the viewer actually clicked through them or jumped straight here with "التالي"/
// "السابق". Only the CURRENT step gets `setup` (which opens the door for the viewer's own click
// without performing it), never `complete` — that would rob the step of its own point.
function applyTourStep(idx){
  for(var i=0;i<idx;i++){
    if(TOUR_STEPS[i].complete){ TOUR_STEPS[i].complete(); }
  }
  var step = TOUR_STEPS[idx];
  if(step.setup){ step.setup(); }
  state.ui.role = step.role;
  state.ui[step.role+"Tab"] = step.tab;
  persist();
}

function renderOverlays(){
  var overlayHost = document.createElement("div");

  while(overlayHost.firstChild){ appEl.appendChild(overlayHost.firstChild); }

  } else if(modal.kind==="cancel-confirm"){
    var b2 = getBooking(modal.bookingId); var s2 = getSession(b2.sessionId);
    title = "تأكيد إلغاء الحجز";
    body = renderSessionSummary(s2) + '<p class="hint" style="margin-top:10px">لن تُخصم أي ساعة عند الإلغاء.</p>';

         + '<button type="button" class="btn btn-danger" data-action="cancelBooking" data-booking="'+esc(b2.id)+'">تأكيد الإلغاء</button>';

    var b3 = getBooking(modal.bookingId); var s3 = getSession(b3.sessionId);

    body = renderSessionSummary(s3)
         + '<form id="comp-form" data-form="compensation">'
         + '<div class="field"><label for="comp-reason">سبب الغياب (اختياري)</label>'
         + '<textarea id="comp-reason" name="reason" placeholder="مثال: ظرف طارئ..."></textarea></div>'
         + '</form>';
    foot = '<button type="button" class="btn btn-outline" data-action="closeModal">إلغاء</button>'
         + '<button type="button" class="btn btn-primary" data-action="submitCompensationBtn" data-booking="'+esc(b3.id)+'">إرسال الطلب</button>';
  } else if(modal.kind==="approve-comp"){
    title = "الموافقة على طلب التعويض — اختيار حصة بديلة";
    var opts = modal.options;
    if(opts.length===0){
      body = '<div class="empty-state"><span class="icon">📭</span>لا توجد حاليًا حصص متاحة لنفس المستوى ('+levelName(modal.missedSession.levelId)+') لاختيارها كبديل. يمكن العودة لاحقًا بعد إضافة حصص جديدة.</div>';
      foot = '<button type="button" class="btn btn-outline" data-action="closeModal">إغلاق</button>';
    } else {
      body = '<p class="hint">الحصة الفائتة: '+esc(levelName(modal.missedSession.levelId))+' — '+esc(fmtDateTime(modal.missedSession.startISO))+'</p>'
           + '<fieldset><legend>اختر حصة بديلة من نفس المستوى</legend>'
           + opts.map(function(o,i){
               return '<label class="radio-option"><input type="radio" name="replacement-session" value="'+esc(o.id)+'"'+(i===0?' checked':'')+'>'
                    + '<span>'+esc(levelName(o.levelId))+' — '+esc(teacherName(o.teacherId))+'<br>'
                    + '<span class="hint">'+esc(fmtDateTime(o.startISO))+' · '+o.durationMinutes+' دقيقة · '+seatsAvailable(o.id)+'/'+o.capacity+' مقاعد متاحة</span></span></label>';
             }).join("")
           + '</fieldset>'
           + '<div id="approve-err" class="err" style="display:none;margin-top:6px"></div>';

  } else if(modal.kind==="reject-comp"){
    title = "رفض طلب التعويض";
    body = '<form id="reject-form" data-form="reject">'
         + '<div class="field"><label for="reject-reason">سبب الرفض (اختياري)</label>'
         + '<textarea id="reject-reason" name="reason" placeholder="مثال: لا يوجد إثبات غياب مقبول..."></textarea></div></form>';
    foot = '<button type="button" class="btn btn-outline" data-action="closeModal">تراجع</button>'
         + '<button type="button" class="btn btn-danger" data-action="confirmRejectBtn" data-req="'+esc(modal.reqId)+'">تأكيد الرفض</button>';
  } else if(modal.kind==="purchase"){
    var stu = getStudent(modal.studentId);
    title = "تسجيل باقة ودفعة جديدة — "+stu.name;
    body = '<form id="purchase-form" data-form="purchase">'
         + '<div class="form-row">'
         + '<div class="field"><label for="p-hours">عدد الساعات</label>'
         + '<select id="p-hours" name="hours"><option value="5">5 ساعات</option><option value="10" selected>10 ساعات</option><option value="20">20 ساعة</option></select></div>'
         + '<div class="field"><label for="p-price">السعر الإجمالي (د.أ)</label>'
         + '<input type="number" id="p-price" name="price" min="1" step="1" value="'+(10*state.settings.pricePerHourJOD)+'"></div>'
         + '</div>'
         + '<div class="note-box">'+esc(state.settings.paymentProviderLabel)+' — سيُعرض هنا لاحقًا تدفّق دفع حقيقي بعد اختيار مزوّد الدفع النهائي. حاليًا هذا تأكيد دفع محاكى فقط.</div>'
         + '</form>';
    foot = '<button type="button" class="btn btn-outline" data-action="closeModal">إلغاء</button>'
         + '<button type="button" class="btn btn-accent" data-action="confirmPurchaseBtn" data-student="'+esc(modal.studentId)+'">تأكيد الدفع (محاكاة)</button>';
  } else if(modal.kind==="meeting"){
    var sess = modal.session;
    title = "🎥 محاكاة الاجتماع — "+levelName(sess.levelId);
    body = '<div class="meet-tiles">'
         + '<div class="meet-tile">'+esc(teacherName(sess.teacherId).slice(-2))+'</div>'
         + '<div class="meet-tile">أنت</div>'
         + '<div class="meet-tile">+'+Math.max(0,occupiedCount(sess.id)-1)+'</div>'
         + '</div>'
         + '<p>'+esc(modal.text)+'</p>'
         + '<div class="warn-box">هذه محاكاة داخل المتصفح فقط — لن يُفتح أي رابط أو تطبيق خارجي، ولن يُعرض أي رابط استضافة أو رمز دخول حقيقي.</div>';
    foot = '<button type="button" class="btn btn-primary" data-action="closeModal">إغلاق</button>';
  }
  return '<div class="modal-overlay" data-action="modalOverlayClick"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'" tabindex="-1">'
       + '<div class="modal-head"><h3>'+esc(title)+'</h3><button type="button" class="btn-ghost" data-action="closeModal" aria-label="إغلاق">✕</button></div>'
       + '<div class="modal-body">'+body+'</div>'
       + '<div class="modal-foot">'+foot+'</div>'
       + '</div></div>';
}

function renderSessionSummary(s){
  var t = getTeacher(s.teacherId);
  return '<div class="kv"><span class="k">المستوى</span><span class="v">'+esc(levelName(s.levelId))+'</span></div>'
       + '<div class="kv"><span class="k">المعلم</span><span class="v">'+esc(t.name)+'</span></div>'
       + '<div class="kv"><span class="k">الموعد</span><span class="v">'+esc(fmtDateTime(s.startISO))+'</span></div>'
       + '<div class="kv"><span class="k">المدة</span><span class="v">'+s.durationMinutes+' دقيقة</span></div>'
       + '<div class="kv"><span class="k">المقاعد المتاحة</span><span class="v">'+seatsAvailable(s.id)+' / '+s.capacity+'</span></div>';
}

    + '</div>'

    + '<p class="login-note">تسجيل الدخول هنا محاكاة بالكامل ولا يمثّل أي مصادقة أو أمان حقيقي — لا تُستخدم هذه البيانات في أي بيئة فعلية.</p>'

/* ======================================================================
   10. RENDER — shell (topbar + sidebar + content)
   ====================================================================== */
function renderShell(){
  var role = state.ui.role;
  var nav = role==="admin"?ADMIN_NAV: role==="teacher"?TEACHER_NAV: role==="student"?STUDENT_NAV: GUARDIAN_NAV;
  var activeTab = state.ui[role+"Tab"];
  var content = renderRoleContent(role, activeTab);
  var tourHtml = "";
  if(runtime.tour.active){
    var step = TOUR_STEPS[runtime.tour.step];
    var stepText = typeof step.text === "function" ? step.text() : step.text;
    tourHtml = '<div class="tourbar">'
      + '<span class="tstep">'+(runtime.tour.step+1)+' / '+TOUR_STEPS.length+'</span>'
      + '<div class="ttext"><strong>'+esc(step.title)+':</strong> '+esc(stepText)+'</div>'
      + '<button type="button" class="btn btn-outline btn-sm" data-action="tourPrev" '+(runtime.tour.step===0?'disabled':'')+' style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">السابق</button>'
      + '<button type="button" class="btn btn-accent btn-sm" data-action="tourNext" '+(runtime.tour.step===TOUR_STEPS.length-1?'disabled':'')+'>'+(runtime.tour.step===TOUR_STEPS.length-1?'انتهت الجولة':'التالي')+'</button>'
      + '<button type="button" class="btn btn-ghost btn-sm" data-action="exitTour" style="color:#fff">إنهاء الجولة</button>'
      + '</div>';
  }
  var inertAttr = runtime.modal ? ' inert aria-hidden="true"' : '';
  return '<div id="shell-main"'+inertAttr+'>'
    + '<div class="topbar">'
    + '<div class="brand">🎓 MVTeaches <span style="font-weight:400;color:var(--muted);font-size:.78rem">— نسخة توضيحية</span></div>'
    + '<div class="role-switch" role="tablist" aria-label="تبديل المستخدم">'
    + ["admin","teacher","student","guardian"].map(function(r){
        return '<button type="button" role="tab" aria-selected="'+(r===role)+'" class="'+(r===role?'active':'')+'" data-action="login" data-role="'+r+'">'+ROLE_LABELS[r]+'</button>';
      }).join("")
    + '</div>'
    + '<div class="spacer"></div>'
    + '<div class="clock-chip" title="الوقت التجريبي — لا علاقة له بالوقت الفعلي لجهازك">⏱️ <strong>'+fmtDateTime(state.clock)+'</strong>'
    + '<button type="button" class="btn btn-ghost btn-sm" data-action="advanceClock" title="محاكاة مرور يوم واحد لتحديث حالة الحصص والغياب">⏩ تقديم يوم</button></div>'
    + '<div class="topbar-actions">'
    + (runtime.tour.active? '' : '<button type="button" class="btn btn-outline btn-sm" data-action="startTour">🧭 جولة تعريفية</button>')
    + '<button type="button" class="btn btn-outline btn-sm" data-action="openResetConfirm">♻️ إعادة ضبط البيانات التجريبية</button>'
    + '<button type="button" class="btn btn-ghost btn-sm" data-action="logout">خروج</button>'
    + '</div></div>'
    + '<div class="layout">'
    + '<nav class="sidebar" aria-label="التنقّل">'
    + nav.map(function(item){
        return '<button type="button" class="nav-item '+(item.key===activeTab?'active':'')+'" data-action="setTab" data-role="'+role+'" data-tab="'+item.key+'" aria-current="'+(item.key===activeTab?'page':'false')+'">'
             + '<span>'+item.icon+'</span><span>'+esc(item.label)+'</span></button>';
      }).join("")
    + '</nav>'
    + '<main class="content">'+content+'</main>'
    + '</div>'
    + tourHtml
    + '</div>';
}

function renderRoleContent(role, tab){
  if(role==="admin") return renderAdmin(tab);
  if(role==="teacher") return renderTeacher(tab);
  if(role==="student") return renderStudent(tab);
  return renderGuardian(tab);
}

/* ======================================================================
   11. RENDER — ADMIN
   ====================================================================== */
function renderAdmin(tab){
  if(tab==="overview") return renderAdminOverview();
  if(tab==="people") return renderAdminPeople();
  if(tab==="levels") return renderAdminLevels();
  if(tab==="packages") return renderAdminPackages();
  if(tab==="schedule") return renderAdminSchedule();
  if(tab==="bookings") return renderAdminBookings();
  if(tab==="compensation") return renderAdminCompensation();
  if(tab==="teachers") return renderAdminTeachers();
  if(tab==="certificates") return renderAdminCertificates();
  if(tab==="payroll") return renderAdminPayroll();
  if(tab==="reports") return renderAdminReports();
  if(tab==="ops") return renderAdminOps();
  return "";
}

function renderAdminOverview(){
  var activeStudents = state.students.length;
  var activePkgs = state.packages.filter(function(p){ return p.remainingHours>0; }).length;
  var upcoming = state.sessions.filter(function(s){ return !isSessionOver(s); }).length;
  var pendingComp = state.compensationRequests.filter(function(r){ return r.status==="Pending"; }).length;
  var stats = [
    {label:"الطلاب المسجّلون", value:activeStudents, hint:state.guardians.length+" ولي أمر"},
    {label:"الباقات الفعّالة", value:activePkgs, hint:state.packages.length+" باقة إجمالًا"},
    {label:"الحصص القادمة", value:upcoming, hint:state.sessions.length+" حصة إجمالًا"},
    {label:"طلبات تعويض معلّقة", value:pendingComp, hint:state.compensationRequests.length+" طلب إجمالًا"}
  ];
  return '<div class="grid grid-4">'+stats.map(renderStatCard).join("")+'</div>'
    + '<div class="card">'
    + '<h2>الحصص القادمة الأقرب</h2><p class="card-sub">أقرب خمس حصص مجدولة، من كل المستويات</p>'
    + renderSessionsTable(state.sessions.filter(function(s){ return !isSessionOver(s); }).sort(function(a,b){return parseLocal(a.startISO)-parseLocal(b.startISO);}).slice(0,5), {showLevel:true})
    + '</div>'
    + '<div class="card"><h2>آخر الأنشطة</h2>'+renderAuditList(state.auditLog.slice(0,6))+'</div>';
}

function renderStatCard(s){
  return '<div class="stat"><div class="stat-label">'+esc(s.label)+'</div><div class="stat-value">'+s.value+'</div><div class="stat-hint">'+esc(s.hint)+'</div></div>';
}

function renderAuditList(list){
  if(list.length===0) return '<div class="empty-state"><span class="icon">🗒️</span>لا توجد أنشطة مسجّلة بعد.</div>';
  return '<div class="table-wrap"><table><thead><tr><th>الوقت</th><th>الحدث</th></tr></thead><tbody>'
    + list.map(function(a){ return '<tr><td style="white-space:nowrap">'+esc(fmtDateTime(a.atISO))+'</td><td>'+esc(a.text)+'</td></tr>'; }).join("")
    + '</tbody></table></div>';
}

function renderAdminPeople(){
  var rows = state.students.map(function(s){
    var g = getGuardian(s.guardianId);
    var pkg = getActivePackage(s.id);
    return '<tr><td>'+esc(s.name)+'</td><td>'+esc(levelName(s.levelId))+'</td><td>'+esc(g?g.name:"—")+'</td>'
      + '<td>'+(pkg? pkg.remainingHours+' / '+pkg.totalHours+' ساعة' : '<span class="badge badge-neutral">لا توجد باقة نشطة</span>')+'</td>'
      + '<td>'+s.totalAttendedHours+' ساعة</td></tr>';
  }).join("");
  var gRows = state.guardians.map(function(g){
    return '<tr><td>'+esc(g.name)+'</td><td>'+esc(g.phone)+'</td><td>'+g.childIds.map(studentName).map(esc).join('، ')+'</td></tr>';
  }).join("");
  return '<div class="card"><h2>الطلاب</h2><p class="card-sub">كل الطلاب المسجّلين وحالتهم الحالية</p>'
    + '<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>المستوى</th><th>ولي الأمر</th><th>الباقة الحالية</th><th>إجمالي الساعات المحضورة</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
    + '<div class="card"><h2>أولياء الأمور</h2>'
    + '<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الأبناء</th></tr></thead><tbody>'+gRows+'</tbody></table></div></div>';
}

function renderAdminLevels(){
  var rows = state.levels.map(function(l){
    var studentCount = state.students.filter(function(s){ return s.levelId===l.id; }).length;
    var sessionCount = state.sessions.filter(function(s){ return s.levelId===l.id; }).length;
    return '<tr><td>'+esc(l.name)+'</td><td>'+studentCount+'</td><td>'+sessionCount+'</td></tr>';
  }).join("");
  return '<div class="card"><h2>المستويات</h2><p class="card-sub">مستويات المنهج المعتمدة حاليًا</p>'
    + '<div class="table-wrap"><table><thead><tr><th>المستوى</th><th>عدد الطلاب</th><th>عدد الحصص</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderAdminPackages(){
  var rows = state.packages.slice().sort(function(a,b){return parseLocal(b.purchasedAtISO)-parseLocal(a.purchasedAtISO);}).map(function(p){
    var st = p.remainingHours>0 ? '<span class="badge badge-success">نشطة</span>' : '<span class="badge badge-neutral">مكتملة</span>';
    return '<tr><td>'+esc(p.id)+'</td><td>'+esc(studentName(p.studentId))+'</td><td>'+p.remainingHours+' / '+p.totalHours+'</td>'
      + '<td>'+esc(fmtCurrency(p.price,p.currency))+'</td><td>'+esc(fmtDate(p.purchasedAtISO))+'</td><td>'+st+'</td></tr>';
  }).join("");
  var studentOptions = state.students.map(function(s){ return '<option value="'+s.id+'">'+esc(s.name)+' — '+esc(levelName(s.levelId))+'</option>'; }).join("");
  return '<div class="card"><h2>تسجيل باقة ودفعة جديدة</h2>'
    + '<p class="card-sub">'+esc(state.settings.paymentProviderLabel)+'</p>'
    + '<div class="form-row"><div class="field"><label for="quick-student">الطالب</label><select id="quick-student">'+studentOptions+'</select></div>'
    + '<div class="field" style="justify-content:flex-end"><button type="button" class="btn btn-primary" data-action="openPurchaseFromSelect">تسجيل باقة جديدة</button></div></div></div>'
    + '<div class="card"><h2>سجل الباقات والمدفوعات</h2>'
    + '<div class="table-wrap"><table><thead><tr><th>رقم الباقة</th><th>الطالب</th><th>الساعات المتبقية</th><th>السعر</th><th>تاريخ الشراء</th><th>الحالة</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderAdminSchedule(){
  var teacherOptions = state.teachers.map(function(t){
    if(!isTeacherReady(t.id)) return "";
    return '<option value="'+t.id+'">'+esc(t.name)+' — '+esc(providerMeta(t.provider.type).label)+'</option>';
  }).join("");
  var notReady = state.teachers.filter(function(t){ return !isTeacherReady(t.id); });
  var levelOptions = state.levels.map(function(l){ return '<option value="'+l.id+'">'+esc(l.name)+'</option>'; }).join("");
  var allSessions = state.sessions.slice().sort(function(a,b){return parseLocal(a.startISO)-parseLocal(b.startISO);});
  return '<div class="card"><h2>إنشاء حصة جديدة</h2>'
    + '<form id="create-session-form" data-form="create-session">'
    + '<div class="form-row">'
    + '<div class="field"><label for="cs-level">المستوى</label><select id="cs-level" name="level">'+levelOptions+'</select></div>'
    + '<div class="field"><label for="cs-teacher">المعلم</label><select id="cs-teacher" name="teacher">'+teacherOptions+'</select>'
    + '<span class="hint" id="cs-teacher-hint"></span></div>'
    + '</div>'
    + '<div class="form-row">'
    + '<div class="field"><label for="cs-date">التاريخ</label><input type="date" id="cs-date" name="date" value="2026-09-15"></div>'
    + '<div class="field"><label for="cs-time">الوقت</label><input type="time" id="cs-time" name="time" value="17:00"></div>'
    + '</div>'
    + '<div class="form-row">'
    + '<div class="field"><label for="cs-duration">المدة (دقيقة)</label><input type="number" id="cs-duration" name="duration" value="60" min="15" max="1440"></div>'
    + '<div class="field"><label for="cs-capacity">السعة (عدد المقاعد)</label><input type="number" id="cs-capacity" name="capacity" value="6" min="1" max="10"></div>'

      + '<td>'+r.hours+' ساعة</td><td>'+esc(fmtCurrency(r.rate,r.currency))+'/ساعة</td><td>'+esc(fmtCurrency(r.amount,r.currency))+'</td></tr>';

    + '</div>';
}

   13. RENDER — TEACHER
   ====================================================================== */
function renderTeacher(tab){
  var t = getTeacher(TEACHER_ID);
  if(tab==="overview") return renderTeacherOverview(t);
  if(tab==="sessions") return renderTeacherSessions(t);
  if(tab==="roster") return renderTeacherRoster(t);
  if(tab==="connections") return renderTeacherConnections(t);
  if(tab==="payroll") return renderTeacherPayroll(t);
  return "";
}

function renderTeacherOverview(t){
  var sess = sessionsForTeacher(t.id);
  var upcoming = sess.filter(function(s){ return !isSessionOver(s); }).sort(function(a,b){return parseLocal(a.startISO)-parseLocal(b.startISO);});
  var next = upcoming[0];
  var completed = sess.filter(isSessionOver).length;
  var ready = isTeacherReady(t.id);
  return (ready? '' : '<div class="warn-box">⚠️ حسابك غير جاهز للحصص الأونلاين حاليًا — الرجاء ربط حساب Zoom أو Google Meet من تبويب «الربط والفيديو».</div>')
    + '<div class="grid grid-3">'
    + renderStatCard({label:"حصصي القادمة", value:upcoming.length, hint:sess.length+" حصة إجمالًا"})
    + renderStatCard({label:"حصصي المكتملة", value:completed, hint:"محسوبة تلقائيًا من سجل الحضور"})
    + renderStatCard({label:"جاهزية الفيديو", value: ready? providerMeta(t.provider.type).label : "غير جاهز", hint: ready? providerMeta(t.provider.type).cap : "—"})
    + '</div>'
    + (next? '<div class="card"><h2>حصتي القادمة</h2>'+renderSessionSummary(next)
        + '<button type="button" class="btn btn-accent" style="margin-top:10px" data-action="startTeacherSessionBtn" data-session="'+next.id+'" '+(ready?'':'disabled')+'>بدء الحصة (محاكاة)</button></div>'
      : '<div class="empty-state"><span class="icon">🗓️</span>لا توجد حصة قادمة مجدولة حاليًا.</div>');
}

function renderTeacherSessions(t){
  var sess = sessionsForTeacher(t.id).slice().sort(function(a,b){return parseLocal(a.startISO)-parseLocal(b.startISO);});
  var ready = isTeacherReady(t.id);
  var rows = sess.map(function(s){
    var phase = sessionPhase(s); // "upcoming" | "live" | "over"
    var notOver = phase !== "over";
    var enrolled = occupiedCount(s.id);
    var canStart = notOver && ready;
    var badge = phase==="live" ? '<span class="badge badge-success">جارية الآن</span>'
      : phase==="upcoming" ? '<span class="badge badge-info">قادمة</span>'
      : '<span class="badge badge-neutral">منتهية</span>';
    return '<tr><td>'+esc(levelName(s.levelId))+'</td><td>'+esc(fmtDateTime(s.startISO))+'</td><td>'+s.durationMinutes+' د</td>'
      + '<td>'+enrolled+' / '+s.capacity+'</td>'
      + '<td>'+badge+'</td>'
      + '<td>'+(canStart? '<button type="button" class="btn btn-accent btn-sm" data-action="startTeacherSessionBtn" data-session="'+s.id+'">بدء الحصة</button>'
          : (notOver? '<button type="button" class="btn btn-outline btn-sm" disabled title="غير جاهز للحصص الأونلاين">غير جاهز</button>' : '—'))+'</td></tr>';
  }).join("");
  return '<div class="card"><h2>حصصي</h2><p class="card-sub">كل الحصص المسندة إليك فقط — لا يمكنك رؤية حصص معلمين آخرين</p>'
    + '<div class="table-wrap"><table><thead><tr><th>المستوى</th><th>الموعد</th><th>المدة</th><th>الطلاب</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderTeacherRoster(t){
  var sess = sessionsForTeacher(t.id);
  var sessionIds = sess.map(function(s){return s.id;});
  var bookingsInScope = state.bookings.filter(function(b){ return sessionIds.indexOf(b.sessionId)!==-1 && b.status!=="Cancelled"; });
  var byStudent = {};
  bookingsInScope.forEach(function(b){
    byStudent[b.studentId] = byStudent[b.studentId] || {attended:0, noshow:0, booked:0};
    if(b.status==="Attended") byStudent[b.studentId].attended++;
    else if(b.status==="NoShow") byStudent[b.studentId].noshow++;
    else byStudent[b.studentId].booked++;
  });
  var rows = Object.keys(byStudent).map(function(sid){
    var st = byStudent[sid];
    return '<tr><td>'+esc(studentName(sid))+'</td><td>'+esc(levelName(getStudent(sid).levelId))+'</td>'
      + '<td>'+st.attended+'</td><td>'+st.noshow+'</td><td>'+st.booked+'</td></tr>';
  }).join("");
  return '<div class="card"><h2>طلابي</h2><p class="card-sub">الطلاب المسجّلون في حصصك فقط</p>'
    + (rows? '<div class="table-wrap"><table><thead><tr><th>الطالب</th><th>المستوى</th><th>حضور</th><th>غياب</th><th>حجوزات قادمة</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      : '<div class="empty-state"><span class="icon">👥</span>لا يوجد طلاب مسجّلون في حصصك بعد.</div>')
    + '</div>';
}

function renderTeacherConnections(t){
  var ready = isTeacherReady(t.id);
  var providerOptions = ["zoom_paid","zoom_basic","google_meet","none"].map(function(p){
    return '<option value="'+p+'" '+(t.provider.type===p?'selected':'')+'>'+esc(providerMeta(p).label)+(p==="none"?'':' — Connect')+'</option>';
  }).join("");
  return '<div class="card"><h2>الربط والفيديو</h2>'
    + '<p class="card-sub">كل معلم يربط حسابه الشخصي عبر OAuth. لا تشتري المؤسسة أو تدير أي رخصة اجتماعات نيابةً عنك.</p>'
    + (ready
        ? '<div class="note-box">حسابك متصل حاليًا: <strong>'+esc(providerMeta(t.provider.type).label)+'</strong> ('+esc(t.provider.accountLabel)+')<br>الحد الحقيقي لهذا المزوّد: '+esc(providerMeta(t.provider.type).cap)+'</div>'
        : '<div class="warn-box">غير جاهز للحصص الأونلاين — لا يمكن إسنادك لحصة أونلاين حتى تربط حسابًا. حساب Google مجاني عادي يكفي، ولا يُشترط اشتراك مدفوع.</div>')
    + '<div class="form-row" style="margin-top:14px;align-items:end">'
    + '<div class="field" style="margin-bottom:0"><label for="teacher-provider-select">محاكاة ربط/فصل حساب</label><select id="teacher-provider-select">'+providerOptions+'</select></div>'
    + '<button type="button" class="btn btn-primary" data-action="applyOwnProviderBtn">تطبيق (محاكاة OAuth)</button>'
    + '</div>'
    + '<p class="hint" style="margin-top:10px">هذا الاختيار محاكاة واجهة فقط لغرض العرض — لا يُنشئ أي اتصال حقيقي بـZoom أو Google.</p>'
    + '</div>'
    + '<div class="card"><h2>أمثلة قدرات المزوّدين في هذه المنصة</h2>'
    + '<div class="grid grid-3">'
    + '<div class="stat"><div class="stat-label">Zoom مدفوع</div><div class="stat-hint">حصص بمدتها الكاملة دون قطع</div></div>'
    + '<div class="stat"><div class="stat-label">Zoom Basic (مجاني)</div><div class="stat-hint">حتى 40 دقيقة فقط للاجتماع</div></div>'
    + '<div class="stat"><div class="stat-label">Google Meet (مجاني)</div><div class="stat-hint">فردي حتى 24 ساعة، جماعي حتى 60 دقيقة</div></div>'
    + '</div></div>';
}

function renderTeacherPayroll(t){
  var rows = derivePayroll().filter(function(r){ return r.teacherId===t.id; }).sort(function(a,b){return parseLocal(b.date)-parseLocal(a.date);});
  var byCurrency = {};
  rows.forEach(function(r){ byCurrency[r.currency]=(byCurrency[r.currency]||0)+r.amount; });
  return '<div class="grid grid-2">'
    + Object.keys(byCurrency).map(function(c){ return renderStatCard({label:"إجمالي المستحق ("+c+")", value:fmtCurrency(byCurrency[c],c), hint:rows.filter(function(r){return r.currency===c;}).length+" حصة"}); }).join("")
    + '</div>'
    + '<div class="card"><h2>سجل رواتبي التفصيلي</h2>'
    + (rows.length? '<div class="table-wrap"><table><thead><tr><th>الطالب</th><th>التاريخ</th><th>الساعات</th><th>سعر الساعة</th><th>المبلغ</th></tr></thead><tbody>'
        + rows.map(function(r){ return '<tr><td>'+esc(studentName(r.studentId))+'</td><td>'+esc(fmtDate(r.date))+'</td><td>'+r.hours+'</td><td>'+esc(fmtCurrency(r.rate,r.currency))+'</td><td>'+esc(fmtCurrency(r.amount,r.currency))+'</td></tr>'; }).join("")
        + '</tbody></table></div>'
      : '<div class="empty-state"><span class="icon">🧾</span>لا توجد حصص مكتملة بعد.</div>')
    + '</div>';
}

/* ======================================================================
   14. RENDER — STUDENT
   ====================================================================== */
function renderStudent(tab){
  var s = getStudent(STUDENT_ID);
  if(tab==="overview") return renderStudentOverview(s);
  if(tab==="available") return renderStudentAvailable(s);
  if(tab==="upcoming") return renderStudentUpcoming(s);
  if(tab==="history") return renderStudentHistory(s);
  if(tab==="certificate") return renderCertificatePanel(s);
  if(tab==="packages") return renderStudentPackages(s);
  if(tab==="notifications") return renderNotificationsPanel(s.id, "student");
  return "";
}

function renderStudentOverview(s){
  var pkg = getActivePackage(s.id);
  var upcoming = bookingsForStudent(s.id).filter(function(b){ return b.status==="Booked"; })
    .map(function(b){return getSession(b.sessionId);}).filter(isFutureSession)
    .sort(function(a,b){return parseLocal(a.startISO)-parseLocal(b.startISO);});
  return '<div class="grid grid-3">'
    + renderStatCard({label:"المستوى الحالي", value:levelName(s.levelId), hint:"—"})
    + renderStatCard({label:"الساعات المتبقية", value: pkg? pkg.remainingHours+" / "+pkg.totalHours : "0", hint: pkg? "باقة "+pkg.id : "لا توجد باقة نشطة"})
    + renderStatCard({label:"إجمالي الساعات المحضورة", value:s.totalAttendedHours, hint:"نحو شهادة إتمام المستوى"})
    + '</div>'
    + '<div class="card"><h2>حصتي القادمة</h2>'
    + (upcoming[0]? renderSessionSummary(upcoming[0]) : '<div class="empty-state"><span class="icon">🗓️</span>لا توجد حصة قادمة محجوزة — يمكنك الحجز من تبويب «الحصص المتاحة».</div>')
    + '</div>';
}

function renderStudentAvailable(s){
  var pkg = getActivePackage(s.id);
  var available = state.sessions.filter(function(sess){
    return sess.levelId===s.levelId && isFutureSession(sess) && !studentBookingForSession(s.id, sess.id);
  }).sort(function(a,b){return parseLocal(a.startISO)-parseLocal(b.startISO);});
  if(available.length===0){
    return '<div class="empty-state"><span class="icon">📭</span>لا توجد حصص متاحة لمستواك ('+esc(levelName(s.levelId))+') حاليًا.</div>';
  }
  var rows = available.map(function(sess){
    var seats = seatsAvailable(sess.id);
    var full = seats<=0;
    var tooSoon = parseLocal(sess.startISO)-now() < BOOKING_LEAD_MIN*60000;
    var disabled = full || tooSoon || !pkg;
    var label = full? "مكتملة العدد" : (tooSoon? "قريبة جدًا" : (!pkg? "لا توجد ساعات متبقية" : ""));
    return '<tr><td>'+esc(teacherName(sess.teacherId))+'</td><td>'+esc(fmtDateTime(sess.startISO))+'</td><td>'+sess.durationMinutes+' د</td>'
      + '<td>'+seats+' / '+sess.capacity+'</td>'
      + '<td>'+(disabled
          ? '<span class="badge badge-neutral">'+label+'</span>'
          : '<button type="button" class="btn btn-primary btn-sm" data-action="openBookConfirmBtn" data-session="'+sess.id+'">حجز</button>')+'</td></tr>';
  }).join("");
  return '<div class="card"><h2>الحصص المتاحة لمستوى '+esc(levelName(s.levelId))+'</h2>'
    + (pkg? '' : '<div class="warn-box" style="margin-bottom:12px">لا توجد لديك ساعات متبقية في أي باقة — لا يمكن الحجز حتى تجديد الباقة.</div>')
    + '<div class="table-wrap"><table><thead><tr><th>المعلم</th><th>الموعد</th><th>المدة</th><th>المقاعد</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderStudentUpcoming(s){
  // Booked/Attended is the correct membership test on its own: settleNoShows() (called at the
  // top of every render()) already flips anything past its session end to NoShow before this
  // runs, so a lingering "future start" check here would incorrectly hide a session during the
  // exact window between its start and its end — precisely when the student needs to see the
  // Join button most.
  var upcoming = bookingsForStudent(s.id).filter(function(b){ return b.status==="Booked"||b.status==="Attended"; })
    .sort(function(a,b){ return parseLocal(getSession(a.sessionId).startISO)-parseLocal(getSession(b.sessionId).startISO); });
  if(upcoming.length===0) return '<div class="empty-state"><span class="icon">🗓️</span>لا توجد حصص قادمة محجوزة حاليًا.</div>';
  var rows = upcoming.map(function(b){
    var sess = getSession(b.sessionId);
    var start = parseLocal(sess.startISO);
    var windowStart = new Date(start.getTime()-JOIN_WINDOW_MIN*60000);
    var canJoin = now() >= windowStart && now() < parseLocal(sessionEndISO(sess));
    var canCancel = b.status==="Booked" && (parseLocal(sess.startISO)-now() >= CANCEL_CUTOFF_MIN*60000);
    return '<tr><td>'+esc(teacherName(sess.teacherId))+(b.isReplacement?' <span class="badge badge-info">تعويض</span>':'')+'</td>'
      + '<td>'+esc(fmtDateTime(sess.startISO))+'</td><td>'+sess.durationMinutes+' د</td>'
      + '<td>'+renderBookingStatusBadge(b)+'</td>'
      + '<td style="display:flex;gap:6px;flex-wrap:wrap">'
      + '<button type="button" class="btn btn-accent btn-sm" data-action="joinSessionBtn" data-booking="'+b.id+'" '+(canJoin||b.status==="Attended"?'':'disabled')+' title="'+(canJoin?'':'يفتح باب الانضمام قبل الموعد بعشر دقائق')+'">انضمام</button>'
      + (canCancel? '<button type="button" class="btn btn-outline btn-sm" data-action="openCancelConfirmBtn" data-booking="'+b.id+'">إلغاء</button>' : '')
      + '</td></tr>';
  }).join("");
  return '<div class="card"><h2>حصصي القادمة</h2><p class="card-sub">زر الانضمام يفتح قبل الموعد بعشر دقائق، ويمكن الضغط عليه أكثر من مرة دون أي خصم إضافي بعد الحضور</p>'
    + '<div class="table-wrap"><table><thead><tr><th>المعلم</th><th>الموعد</th><th>المدة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderStudentHistory(s){
  var list = bookingsForStudent(s.id).filter(function(b){ return b.status==="Attended"||b.status==="NoShow"; })
    .sort(function(a,b){ return parseLocal(getSession(b.sessionId).startISO)-parseLocal(getSession(a.sessionId).startISO); });
  if(list.length===0) return '<div class="empty-state"><span class="icon">📋</span>لا يوجد سجل حضور بعد.</div>';
  var rows = list.map(function(b){
    var sess = getSession(b.sessionId);
    var req = b.compensationRequestId? getCompReq(b.compensationRequestId) : null;
    var compCell = "—";
    if(b.status==="NoShow"){
      if(!req) compCell = '<button type="button" class="btn btn-outline btn-sm" data-action="openCompFormBtn" data-booking="'+b.id+'">تقديم طلب تعويض</button>';
      else if(req.status==="Pending") compCell = '<span class="badge badge-warning">الطلب قيد المراجعة</span>';
      else if(req.status==="Approved") compCell = '<span class="badge badge-success">تمت الموافقة — بديل بتاريخ '+esc(fmtShortDate(getSession(req.replacementSessionId).startISO))+'</span>';
      else compCell = '<span class="badge badge-danger">مرفوض</span>';
    }
    return '<tr><td>'+esc(teacherName(sess.teacherId))+(b.isReplacement?' <span class="badge badge-info">تعويض</span>':'')+'</td>'
      + '<td>'+esc(fmtDateTime(sess.startISO))+'</td><td>'+renderBookingStatusBadge(b)+'</td><td>'+compCell+'</td></tr>';
  }).join("");
  return '<div class="card"><h2>سجل الحضور والغياب</h2>'
    + '<div class="table-wrap"><table><thead><tr><th>المعلم</th><th>الموعد</th><th>الحالة</th><th>التعويض</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderCertificatePanel(s){
  var pct = Math.min(100, Math.round(100*s.totalAttendedHours/state.settings.certificateRequiredHours));
  var eligible = s.totalAttendedHours >= state.settings.certificateRequiredHours;
  return '<div class="card"><h2>تقدّم الشهادة</h2>'
    + '<div class="kv"><span class="k">الساعات المحضورة</span><span class="v">'+s.totalAttendedHours+'</span></div>'
    + '<div class="kv"><span class="k">الحد المطلوب حاليًا</span><span class="v">'+state.settings.certificateRequiredHours+' ساعة</span></div>'
    + '<div class="progress" style="margin:12px 0"><span style="width:'+pct+'%"></span></div>'
    + (eligible? '<span class="badge badge-success">مبروك — أصبحتِ مؤهّلة لإصدار الشهادة 🎉</span>'
        : '<span class="badge badge-neutral">لا تزال هناك '+(state.settings.certificateRequiredHours-s.totalAttendedHours)+' ساعة متبقية</span>')
    + '<p class="hint" style="margin-top:10px">هذا التقدّم يُحسب دائمًا وفق القيمة الحالية للحد الأدنى المطلوب، وليس رقمًا مخزّنًا بشكل منفصل لكل طالب.</p>'
    + '</div>';
}

function renderStudentPackages(s){
  var list = packagesForStudent(s.id);
  var rows = list.map(function(p){
    var st = p.remainingHours>0? '<span class="badge badge-success">نشطة</span>' : '<span class="badge badge-neutral">مكتملة</span>';
    return '<tr><td>'+esc(p.id)+'</td><td>'+p.remainingHours+' / '+p.totalHours+'</td><td>'+esc(fmtCurrency(p.price,p.currency))+'</td><td>'+esc(fmtDate(p.purchasedAtISO))+'</td><td>'+st+'</td></tr>';
  }).join("");
  return '<div class="card"><h2>باقاتي</h2><p class="card-sub">'+esc(state.settings.paymentProviderLabel)+' — كل عملية شراء تُسجَّل كباقة ودورة حجز جديدة ومستقلة</p>'
    + (rows? '<div class="table-wrap"><table><thead><tr><th>رقم الباقة</th><th>الساعات المتبقية</th><th>السعر</th><th>تاريخ الشراء</th><th>الحالة</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      : '<div class="empty-state"><span class="icon">💳</span>لا توجد باقات مسجّلة بعد لهذا الطالب.</div>')
    + '</div>';
}

function renderNotificationsPanel(subjectId, audience){
  var list = state.notifications.filter(function(n){
    if(audience==="student") return n.audience==="student" && n.studentId===subjectId;
    return n.audience==="student" && getStudent(n.studentId) && getStudent(n.studentId).guardianId===subjectId;
  }).sort(function(a,b){ return parseLocal(b.createdAtISO)-parseLocal(a.createdAtISO); });
  if(list.length===0) return '<div class="empty-state"><span class="icon">🔔</span>لا توجد إشعارات بعد.</div>';
  return '<div class="card"><h2>الإشعارات</h2>'
    + '<div class="table-wrap"><table><thead><tr><th>الوقت</th><th>الإشعار</th></tr></thead><tbody>'
    + list.map(function(n){ return '<tr><td style="white-space:nowrap">'+esc(fmtDateTime(n.createdAtISO))+'</td><td>'+esc(n.text)+'</td></tr>'; }).join("")
    + '</tbody></table></div></div>';
}

/* ======================================================================
   15. RENDER — GUARDIAN
   ====================================================================== */
function renderGuardian(tab){
  var g = getGuardian(GUARDIAN_ID);
  var childId = g.childIds.indexOf(state.ui.guardianChildId)!==-1 ? state.ui.guardianChildId : g.childIds[0];
  var child = getStudent(childId);
  var switcher = '<div class="child-switch">'
    + g.childIds.map(function(cid){
        var c = getStudent(cid);
        return '<button type="button" class="'+(cid===childId?'active':'')+'" data-action="setGuardianChild" data-child="'+cid+'">'+esc(c.name)+' — '+esc(levelName(c.levelId))+'</button>';
      }).join("")
    + '</div>'
    + '<div class="note-box" style="margin-bottom:14px">ولي الأمر يمكنه المتابعة فقط، ولا يمكنه الحجز أو الانضمام إلى أي حصة نيابةً عن الطالب.</div>';
  var body = "";
  if(tab==="overview") body = renderStudentOverview(child);
  else if(tab==="history") body = renderStudentHistory(child);
  else if(tab==="packages") body = renderStudentPackages(child);
  else if(tab==="certificate") body = renderCertificatePanel(child);
  else if(tab==="notifications") body = renderNotificationsPanel(g.id, "guardian");
  return switcher + body;
}

/* ======================================================================
   16. EVENT WIRING
   ====================================================================== */
function actionDispatch(name, el){
  var data = el.dataset;
  switch(name){
    case "login": actions.login(data.role); break;
    case "logout": actions.logout(); break;
    case "setTab": actions.setTab(data.role, data.tab); break;
    case "setGuardianChild": actions.setGuardianChild(data.child); break;
    case "closeModal": actions.closeModal(); break;
    case "dismissToast": actions.dismissToast(); break;
    case "openResetConfirm": actions.openResetConfirm(); break;
    case "confirmReset": actions.confirmReset(); break;
    case "advanceClock": actions.advanceClock(); break;
    case "startTour": actions.startTour(); break;
    case "tourNext": actions.tourNext(); break;
    case "tourPrev": actions.tourPrev(); break;
    case "exitTour": actions.exitTour(); break;
    case "openBookConfirmBtn": actions.openBookConfirm(data.session); break;
    case "bookSession": actions.bookSession(data.session); break;
    case "openCancelConfirmBtn": actions.openCancelConfirm(data.booking); break;
    case "cancelBooking": actions.cancelBooking(data.booking); break;
    case "joinSessionBtn": actions.joinSession(data.booking); break;
    case "openCompFormBtn": actions.openCompensationForm(data.booking); break;
    case "submitCompensationBtn":
      var reasonEl = document.getElementById("comp-reason");
      actions.submitCompensation(data.booking, reasonEl? reasonEl.value : "");
      break;
    case "openApproveComp": actions.openApproveCompensation(data.req); break;
    case "confirmApproveBtn":
      var picked = document.querySelector('input[name="replacement-session"]:checked');
      actions.confirmApproveCompensation(data.req, picked? picked.value : null);
      break;
    case "openRejectComp": actions.openRejectCompensation(data.req); break;
    case "confirmRejectBtn":
      var rReason = document.getElementById("reject-reason");
      actions.confirmRejectCompensation(data.req, rReason? rReason.value : "");
      break;
    case "startTeacherSessionBtn": actions.startTeacherSession(data.session); break;
    case "applyProviderBtn":
      var sel = document.getElementById("prov-"+data.teacher);
      actions.setTeacherProvider(data.teacher, sel? sel.value : "none");
      break;
    case "applyOwnProviderBtn":
      var sel2 = document.getElementById("teacher-provider-select");
      actions.setTeacherProvider(TEACHER_ID, sel2? sel2.value : "none");
      break;
    case "openPurchaseFromSelect":
      var studSel = document.getElementById("quick-student");
      actions.openPurchaseModal(studSel? studSel.value : STUDENT_ID);
      break;
    case "confirmPurchaseBtn":
      var hoursEl = document.getElementById("p-hours");
      var priceEl = document.getElementById("p-price");
      actions.confirmPurchase(data.student, parseInt(hoursEl.value,10), parseFloat(priceEl.value));
      break;
    case "modalOverlayClick":
      if(el === document.activeElement || true){ /* overlay itself clicked (not its children) */ }
      break;
    default: break;
  }
}

document.addEventListener("click", function(e){
  var target = e.target.closest("[data-action]");
  if(!target) return;
  if(target.dataset.action==="modalOverlayClick"){
    if(e.target !== target) return; // only close when the backdrop itself (not the modal box) is clicked
    actions.closeModal();
    return;
  }
  actionDispatch(target.dataset.action, target);
});

document.addEventListener("submit", function(e){
  var form = e.target.closest("form[data-form]");
  if(!form) return;
  e.preventDefault();
  var kind = form.dataset.form;
  if(kind==="create-session") actions.createSession(form);
  else if(kind==="settings") actions.saveSettings(form);
  else if(kind==="compensation"){
    var bId = runtime.modal && runtime.modal.bookingId;
    var reasonEl = document.getElementById("comp-reason");
    if(bId) actions.submitCompensation(bId, reasonEl?reasonEl.value:"");
  }
  else if(kind==="reject"){
    var rId = runtime.modal && runtime.modal.reqId;
    var reasonEl2 = document.getElementById("reject-reason");
    if(rId) actions.confirmRejectCompensation(rId, reasonEl2?reasonEl2.value:"");
  }
  else if(kind==="purchase"){
    var sId = runtime.modal && runtime.modal.studentId;
    var hoursEl = document.getElementById("p-hours");
    var priceEl = document.getElementById("p-price");
    if(sId) actions.confirmPurchase(sId, parseInt(hoursEl.value,10), parseFloat(priceEl.value));
  }
});

document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && runtime.modal){ actions.closeModal(); }
});

function wirePostRenderHints(){
  var teacherSelect = document.getElementById("cs-teacher");
  var hint = document.getElementById("cs-teacher-hint");
  var durationInput = document.getElementById("cs-duration");
  var capacityInput = document.getElementById("cs-capacity");
  function updateHint(){
    if(!teacherSelect || !hint) return;
    var t = getTeacher(teacherSelect.value);
    if(!t){ hint.textContent=""; return; }
    var cap = capacityInput? (parseInt(capacityInput.value,10)||1) : 1;
    hint.textContent = "الحد الأقصى الحقيقي لهذا المعلم: "+maxDurationForTeacher(t,cap)+" دقيقة";
  }
  if(teacherSelect){ teacherSelect.addEventListener("change", updateHint); }
  if(capacityInput){ capacityInput.addEventListener("input", updateHint); }
  updateHint();

  var modalEl = document.querySelector(".modal");
  if(modalEl){ modalEl.focus(); }
}

/* ======================================================================
   17. BOOT
   ====================================================================== */
render();

})();
</script>
